# Test groups (AGENTS.md "Test groups"). PRs into main, and pushes to main and integration/**, run
# every group. PRs into anything else, and docs-only PRs, run lint plus `go test -short`. Every push
# to main also publishes the `edge` image (untested by people, unsigned, never a release). See
# RELEASING.md.
#
# Branch protection requires only `ci-ok main`. The check name carries the PR's base, so a PR
# opened against an integration branch and retargeted to main has no `ci-ok main` until its next
# push: it cannot merge on a run that skipped the browser checks.
name: ci

on:
  pull_request:
  push:
    branches: [main, "integration/**"]

permissions:
  contents: read

# A newer push replaces an older build still running, so `edge` can't end up on an older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/sethdotfm/sode
  # Browser checks fail instead of skipping when Chrome or go is missing (browserTest).
  SODE_REQUIRE_BROWSER: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.pick.outputs.full }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          full=false
          if [[ $EVENT == push ]]; then
            full=true
          elif [[ $BASE == main ]]; then
            full=true
            # Docs-only means every file is *.md or under docs/. Any error listing files runs everything.
            if files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only) && [[ -n $files ]] \
              && ! grep -Ev '(^docs/|\.md$)' <<<"$files" >/dev/null; then
              full=false
              echo "docs-only PR: lint and go test -short"
            fi
          fi
          echo "full=$full" | tee -a "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # 2026.2.2 is the first staticcheck that loads Go 1.27 export data. Bump by hand (RELEASING.md).
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal web | tee /dev/stderr)"
      # Same globs and version as .claude/hooks/lint.sh.
      - run: npx --yes prettier@3.3.3 --check 'web/*.js' 'web/test/*.mjs' 'web/*.css'
      - run: node --test 'web/test/*.test.mjs'
      - run: npx --yes eslint@10.14.0 web

  go:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: needs.changes.outputs.full == 'true'
        run: go test -count=1 -timeout 20m -skip '^TestChrome' ./...
      - if: needs.changes.outputs.full != 'true'
        run: go test -count=1 -short ./...

  browser:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: .github/scripts/browser-checks.sh ${{ matrix.shard }} 3 '^TestChrome' 'HoldsNoMemory'

  leak:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: .github/scripts/browser-checks.sh 0 1 'HoldsNoMemory'

  ci-ok:
    name: ci-ok ${{ github.base_ref || github.ref_name }}
    if: always()
    needs: [changes, lint, go, browser, leak]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]

  edge:
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ok.result == 'success' }}
    needs: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: sode
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
