# A tag vX.Y.Z-rc.N on main (or a release/X.Y branch) builds the release
# candidate: tests, image, scan, then provenance and a cosign signature LAST,
# so a signed image has passed everything. promote.yml only accepts a signed
# one. See RELEASING.md.
name: rc

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sethdotfm/sode

jobs:
  rc:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the pre-release
      packages: write
      id-token: write # cosign keyless and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag must be on main or a release branch
        run: |
          set -euo pipefail
          git branch -r --contains "$GITHUB_SHA" | grep -Eq '^\s*origin/(main|release/[0-9]+\.[0-9]+)$' \
            || { echo "::error::$GITHUB_REF_NAME is not on main or a release/X.Y branch"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tests, and the tag matches version.go, README and CHANGELOG
        run: |
          set -euo pipefail
          go vet ./...
          SODE_REQUIRE_BROWSER=1 go test -count=1 -timeout 30m ./...
          node --test 'web/test/*.test.mjs'
          SODE_RELEASE_TAG="$GITHUB_REF_NAME" go test ./internal/app -run TestVersionNoted -count=1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        name: An rc tag is never reused
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:$v" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$v already exists; cut the next rc number instead"
            exit 1
          fi
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: sode
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:rc
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Trivy runs from its container image (pinned by digest), not the
      # action: the action's installer failed to download the binary here.
      - name: Scan (no fixable CRITICAL)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            ghcr.io/aquasecurity/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --severity CRITICAL --exit-code 1 --ignore-unfixed "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign last, so a signature means every step above passed
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          base="${GITHUB_REF_NAME%-rc.*}"; base="${base#v}"
          awk -v h="## Beta $base" 'index($0,h)==1{p=1;next} p&&/^## /{exit} p' CHANGELOG.md > notes.md
          printf '\nImage: `%s:%s`\nDigest: `%s`\n\nA release candidate: tested, not yet promoted. Pull `%s:rc` to try it.\n' \
            "$IMAGE" "${GITHUB_REF_NAME#v}" "$DIGEST" "$IMAGE" >> notes.md
          gh release create "$GITHUB_REF_NAME" --prerelease --verify-tag --title "Beta ${GITHUB_REF_NAME#v}" --notes-file notes.md
