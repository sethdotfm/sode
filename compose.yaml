# Checkout compose file: builds from this directory. To run the published
# image instead, use the compose.yaml in README.md.
# Real router:   SODE_ROUTER=10.0.0.50:8910 docker compose up -d --build
# Simulator:     docker compose --profile sim up --build
# SODE_ROUTER only seeds /data/config.yaml on first start; after that, change
# it (and everything else) from the Settings dialog.
services:
  sode:
    build: { context: ., target: sode }
    image: sode
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["sode-data:/data"]
    environment:
      SODE_ROUTER: ${SODE_ROUTER:-swp08sim:8910}

  swp08sim:
    build: { context: ., target: sim }
    image: swp08sim
    profiles: ["sim"]
    ports: ["8910:8910"]
    environment:
      # Seconds between routes made by the simulator itself, like a panel; 0 = off.
      SIM_PANEL_SECONDS: ${SIM_PANEL_SECONDS:-0}
      # 1 = those routes send no Connected, so Sode only finds them in a resync.
      SIM_PANEL_SILENT: ${SIM_PANEL_SILENT:-0}
      # Destination follows, 0-based dst>dst, e.g. 2>40,3>41.
      SIM_FOLLOWS: ${SIM_FOLLOWS:-}

volumes:
  sode-data:
