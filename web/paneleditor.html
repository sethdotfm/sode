<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- /panels/editor sits one level down; ../ is Sode's root -->
<base href="../">
<title>Sode Panel Editor</title>
<link rel="icon" type="image/svg+xml" href="panels-logo.svg">
<link rel="icon" type="image/png" href="icon.png?s=192">
<script src="prepaint.js" data-only="theme"></script>
<link rel="stylesheet" href="vendor/fonts/plex.css">
<link rel="stylesheet" href="vendor/patchbay/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/patchbay/css/patchbay.tokens.css">
<link rel="stylesheet" href="vendor/patchbay/css/patchbay.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="bar.css">
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="panels.css">
<!-- The Live Editor runs a Grid panel here too. Keep in step with panel.html: gridpanelphone.css hides the phone-only parts on the desktop. -->
<link rel="stylesheet" href="gridpanel.css">
<link rel="stylesheet" href="gridpanelphone.css">
<link rel="stylesheet" href="touch.css">
</head>
<body>

<main class="sode-panels sode-ed">
  <header class="sode-panels__head">
    <!-- The links and the status join it (panelsbar.js). The brand event (panelpage.js) builds the title again from the site name and data-page. -->
    <h1 class="sode-panels__title" data-page="Panel Editor">Sode Panel Editor</h1>
    <span class="sode-panels__spacer"></span>
    <span class="sode-inbox__slot" data-inbox></span>
  </header>
  <p class="sode__hint" id="panels-note"></p>
  <button class="pb-btn pb-btn--outline pb-btn--sm" id="panels-signin" type="button" hidden>Sign in</button>

  <div class="pb-banner" id="ed-banner" hidden>
    <span>Shared with you: read-only.</span>
    <button class="pb-btn pb-btn--sm" id="ed-copy" type="button">Save a copy</button>
  </div>

  <div class="pb-toolbar sode-ed__bar" role="toolbar" aria-label="Panel editor">
    <div class="sode-ed__grp sode-ed__grp--pick">
      <label class="sode-ed__field" for="ed-pick">Panel
        <span class="pb-select-wrap"><select class="pb-select sode-ed__pick" id="ed-pick"></select></span>
      </label>
      <label class="sode-ed__field" for="ed-name">Name
        <input class="pb-input" id="ed-name" type="text" maxlength="64" autocomplete="off">
      </label>
    </div>
    <span class="sode-panels__spacer"></span>
    <!-- Copy link and Open panel keep their place before the first save, disabled, so nothing moves (editortoolbar.js). -->
    <div class="sode-ed__grp">
      <button class="pb-btn pb-btn--outline pb-btn--sm" id="ed-share" type="button" disabled><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#pb-i-share-2"/></svg>Share</button>
      <button class="pb-btn pb-btn--outline pb-btn--sm" id="ed-copylink" type="button" disabled><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#pb-i-copy"/></svg>Copy link</button>
      <a class="pb-btn pb-btn--outline pb-btn--sm" id="ed-open" href="panels" aria-disabled="true"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#pb-i-external-link"/></svg>Open panel</a>
      <button class="pb-btn pb-btn--outline pb-btn--sm" id="ed-live" type="button" data-pb-tip="Runs the saved panel here, without unassigned squares. Saves first."><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#pb-i-play"/></svg>Live Editor</button>
    </div>
    <div class="sode-ed__grp">
      <span class="sode-ed__state" id="ed-state" role="status"></span>
      <button class="pb-btn sode-btn--primary pb-btn--sm" id="ed-save" type="button">Save</button>
    </div>
  </div>
  <p class="sode__hint" id="ed-status" role="status" hidden></p>

  <div class="sode-ed__live" id="ed-live-view" hidden></div>

  <div class="sode-ed__body">
    <div class="sode-ed__main">
      <nav class="sode-pages" id="ed-pages" aria-label="Pages"></nav>
      <div class="sode-ed__open" id="ed-open-pages">
        <section class="sode-ed__frame" id="ed-frame">
          <h2 class="sode-ed__frame-title" id="ed-frame-title"></h2>
          <!-- The grid's room: the grid fits it by width and height (panels.css .sode-ed__fit). -->
          <div class="sode-ed__fit"><div class="sode-ed__grid" id="ed-grid" aria-label="Panel grid"></div></div>
        </section>
      </div>
    </div>
    <!-- A Grid panel's Sources and Destinations lists, in place of the Pages (editorside.js) -->
    <div class="sode-ed__lists" id="ed-lists"></div>
    <aside class="sode-ed__side" id="ed-side" aria-label="Panel settings" data-bigscroll-room></aside>
  </div>
</main>

<script type="module" src="panelpage.js"></script>
</body>
</html>
