<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sode Communication Log</title>
<link rel="icon" type="image/png" href="icon.png?s=192">
<script src="prepaint.js" data-only="theme"></script>
<link rel="stylesheet" href="vendor/fonts/plex.css">
<link rel="stylesheet" href="vendor/patchbay/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/patchbay/css/patchbay.tokens.css">
<link rel="stylesheet" href="vendor/patchbay/css/patchbay.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="bar.css">
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="log.css">
<link rel="stylesheet" href="touch.css">
</head>
<body>

<main class="sode-log">
  <header class="sode-log__head">
    <!-- The links and the status join it (panelsbar.js). -->
    <h1 class="sode-log__title sode-panels__title" data-page="Communication Log">Sode Communication Log</h1>
    <span class="sode-log__spacer"></span>
    <span class="sode-inbox__slot" data-inbox></span>
  </header>

  <section class="sode-log__uptime" aria-labelledby="log-uptime-title">
    <div class="sode-log__line">
      <h2 class="sode__label" id="log-uptime-title">Router uptime</h2>
      <fieldset class="sode-log__kinds" id="log-uptime-presets" aria-label="Time range"></fieldset>
      <span class="sode-log__up-sum" id="log-uptime-sum" aria-live="polite"></span>
    </div>
    <!-- With two or more routers each router has its own line and bars (logrouters.js): the first router here, the
         others in #log-uptime-more. -->
    <div class="sode-log__up-router" id="log-uptime-first" hidden></div>
    <div class="sode-up__bars" id="log-uptime-bars" role="group" aria-label="Router uptime: loading"></div>
    <div class="sode-log__up-more" id="log-uptime-more"></div>
    <p class="sode__hint sode-log__legend">
      <span><i class="sode-up__key sode-up__bar--ok"></i>Up</span>
      <span data-pb-tip="Down for part of the slot, or messages failed or were slow"><i class="sode-up__key sode-up__bar--warn"></i>Partial</span>
      <span data-pb-tip="Router down, or Sode not running"><i class="sode-up__key sode-up__bar--error"></i>Down</span>
      <span><i class="sode-up__key sode-up__bar--none"></i>No data</span>
    </p>
  </section>

  <form class="sode-log__filters" autocomplete="off" aria-label="Filters">
    <div class="sode-log__line">
      <fieldset class="sode-log__kinds" id="log-kinds">
        <legend class="sode__label">Show</legend>
      </fieldset>
    </div>
    <div class="sode-log__line" id="log-routers-line" hidden>
      <fieldset class="sode-log__kinds" id="log-routers">
        <legend class="sode__label">Routers</legend>
      </fieldset>
    </div>
    <div class="sode-log__line">
      <label class="sode-log__when"><span class="sode__label">From</span><input type="datetime-local" step="1" class="pb-input" id="log-from"></label>
      <label class="sode-log__when"><span class="sode__label">To</span><input type="datetime-local" step="1" class="pb-input" id="log-to"></label>
      <button type="button" class="pb-btn pb-btn--ghost pb-btn--sm" id="log-range-clear" hidden>Clear times</button>
    </div>
    <div class="sode-log__line">
      <input class="pb-input sode-log__expr" id="log-src" placeholder="Filter by Source" aria-label="Filter by source" spellcheck="false">
      <input class="pb-input sode-log__expr" id="log-dst" placeholder="Filter by Destination" aria-label="Filter by destination" spellcheck="false">
      <span class="sode__hint" id="log-count" aria-live="polite"></span>
      <span class="sode-log__spacer"></span>
      <button type="button" class="pb-btn pb-btn--outline pb-btn--sm" id="log-download-rows" data-pb-tip="One CSV file: the rows that match these filters in the whole log, in this order">Download filtered rows</button>
      <button type="button" class="pb-btn pb-btn--outline pb-btn--sm" id="log-download-full" data-pb-tip="One zip file: all Log rows, oldest first, and the uptime record">Download full log</button>
    </div>
  </form>
  <div class="pb-note pb-note--error" id="log-download-err" role="alert" hidden></div>
  <div class="pb-note pb-note--warn" id="log-lost" role="status" hidden></div>
  <div class="pb-note sode-log__slot" id="log-slot" role="status" hidden></div>

  <div class="sode-log__scroll">
    <table class="pb-table pb-table--compact sode-log__table">
      <thead>
        <tr>
          <th scope="col" data-sort="time">Time</th>
          <th scope="col" data-sort="message">Message</th>
          <th scope="col" data-sort="level">Level</th>
          <th scope="col" data-sort="dst">Destination</th>
          <th scope="col" data-sort="src">Source</th>
          <th scope="col" data-sort="why">Reason</th>
          <th scope="col" data-sort="result">Result</th>
          <th scope="col" data-sort="hex">Bytes</th>
        </tr>
      </thead>
      <tbody id="log-rows"></tbody>
    </table>
  </div>
  <div class="sode-log__more">
    <span class="sode__hint" id="log-empty" hidden></span>
    <button type="button" class="pb-btn pb-btn--outline pb-btn--sm" id="log-older" hidden>Load older</button>
  </div>
</main>

<script type="module" src="log.js"></script>
</body>
</html>
