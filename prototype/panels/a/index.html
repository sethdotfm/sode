<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panels prototype A: button bank</title>
<link rel="stylesheet" href="/vendor/patchbay/css/patchbay.tokens.css"><link rel="stylesheet" href="/shared/proto.css">
<style>/* A: classic hardware bank. Destinations on top, sixteen sources, a control strip below. */
.cell { border-radius:.35rem }</style></head><body><div id="deck"></div>
<script type="module">
import { createPanel } from '/shared/model.js'
import { buildDeck } from '/shared/deck.js'
import { toolbar } from '/shared/toolbar.js'
const p = createPanel()
toolbar(p, 'A button bank')
const cells = []
for (let i = 0; i < 8; i++) cells.push({ r: 1, c: i + 1, kind: 'dst', n: i })
for (let i = 0; i < 16; i++) cells.push({ r: 2 + (i >> 3), c: (i & 7) + 1, kind: 'src', n: i })
cells.push({ r: 4, c: 1, cs: 2, kind: 'cur' }, { r: 4, c: 3, kind: 'pre', id: 'p1' }, { r: 4, c: 4, kind: 'pre', id: 'p2' }, { r: 4, c: 5, kind: 'clr' }, { r: 4, c: 6, cs: 3, kind: 'take' })
buildDeck(document.getElementById('deck'), p, cells)
</script></body></html>
