<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/patchbay/css/bootstrap.min.css"><link rel="stylesheet" href="/vendor/patchbay/css/patchbay.tokens.css"><link rel="stylesheet" href="/vendor/patchbay/css/patchbay.css"><link rel="stylesheet" href="/shared/proto.css"><link rel="stylesheet" href="/shared/ed.css"><title>Editor prototype A: inspector</title></head><body><div class="ed-app a"><div class="ed-body">
<aside class="ed-pal" id="pal"></aside><main class="ed-main"><div id="ro"></div><div id="canvas"></div><p class="pb-hint">Click a square. Shift-click or drag to select several, then Merge. Picked a sequence? Click the square to start from.</p></main><aside class="ed-side" id="side"></aside></div></div>
<script type="module">
import { createEditor, KINDS } from '/shared/ed.js'
import { canvas, inspector, settings, sequencer, tabs, toolbar, icon } from '/shared/edview.js'
const E = createEditor()
toolbar(E, 'Panel editor', { steppers: true, panels: true })
const ro = document.getElementById('ro')
E.on((t) => { if (t === 'init' || t === 'panel') { const p = E.panels[E.curPanel]; ro.innerHTML = p.own ? '' : `<div class="pb-banner pb-banner--info"><span>${p.who} shared this panel. You can use it. To change it, save a copy.</span> <button class="pb-btn pb-btn--sm" id="copy">${icon('copy')} Save a copy</button></div>`; const c = document.getElementById('copy'); if (c) c.onclick = () => E.copyPanel() } })
canvas(document.getElementById('canvas'), E)
const pal = document.getElementById('pal')
pal.innerHTML = '<div class="pb-label">Button type</div><div class="ed-kinds">' + KINDS.map((k) => `<button class="pb-btn pb-btn--sm" data-k="${k.k}">${icon(k.icon)} ${k.name}</button>`).join('') + '</div><div class="pb-row pb-row--tight"><button class="pb-btn pb-btn--sm pb-btn--commit" data-m>' + icon('merge') + ' Merge</button><button class="pb-btn pb-btn--sm" data-u>' + icon('split') + ' Unmerge</button><button class="pb-btn pb-btn--sm pb-btn--danger" data-r>' + icon('trash-2') + ' Remove</button></div><div class="pb-divider"></div><div id="seq" class="ed-sec"></div>'
pal.onclick = (e) => { const b = e.target.closest('button[data-k],button[data-m],button[data-u],button[data-r]'); if (!b || E.readonly) return; if (b.dataset.k) E.setKind(b.dataset.k); if ('m' in b.dataset) E.merge(); if ('u' in b.dataset) E.unmerge(); if ('r' in b.dataset) E.remove() }
E.on((t) => { if (t === 'sel' || t === 'layout' || t === 'init') { pal.querySelector('[data-m]').disabled = E.selSquares() < 2; pal.querySelector('[data-u]').disabled = !E.canUnmerge(); pal.querySelector('[data-r]').disabled = !E.selCells().length } })
sequencer(document.getElementById('seq'), E)
tabs(document.getElementById('side'), [
  { text: 'Cell', render: (n) => inspector(n, E) },
  { text: 'Panel', render: (n) => settings(n, E, ['identity', 'appearance', 'behaviour', 'colours']) },
  { text: 'Access', render: (n) => settings(n, E, ['access', 'sharing']) },
])
</script></body></html>
