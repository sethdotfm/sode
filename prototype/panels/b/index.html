<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panels prototype B: destination rail</title>
<link rel="stylesheet" href="/vendor/patchbay/css/patchbay.tokens.css"><link rel="stylesheet" href="/shared/proto.css">
<style>/* B: destinations as a two-column rail on the left, big Current Destination across the top. */
:root { --gap:.5rem; --c-idle:#34414f; --c-cur:#14507a }
body { background:#0a1018 } .cell { border-radius:.8rem }</style></head><body><div id="deck"></div>
<script type="module">
import { createPanel } from '/shared/model.js'
import { buildDeck } from '/shared/deck.js'
import { toolbar } from '/shared/toolbar.js'
const p = createPanel()
toolbar(p, 'B destination rail')
const cells = []
for (let i = 0; i < 8; i++) cells.push({ r: 1 + (i >> 1), c: 1 + (i & 1), kind: 'dst', n: i })
cells.push({ r: 1, c: 3, cs: 6, kind: 'cur' })
for (let i = 0; i < 12; i++) cells.push({ r: 2 + (i / 6 | 0), c: 3 + (i % 6), kind: 'src', n: i })
cells.push({ r: 4, c: 3, kind: 'pre', id: 'p1' }, { r: 4, c: 4, kind: 'pre', id: 'p2' }, { r: 4, c: 5, kind: 'clr' }, { r: 4, c: 6, cs: 3, kind: 'take' })
buildDeck(document.getElementById('deck'), p, cells)
</script></body></html>
