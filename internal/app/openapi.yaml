openapi: 3.0.3
info:
  title: Sode API
  version: "1"
  description: |
    Read and command access to one SW-P-08 router through Sode. The API is off until an administrator
    turns it on in Settings. Served at /api/v1/openapi.yaml, always open.

    Auth. Send a key as `Authorization: Bearer <key>`. A key is never accepted in a query
    string. A call with no Authorization header is a Guest call, allowed only while the Guest
    API switch is on, and only for the scopes Guest has been given.

    Numbers. Sources and destinations are the router's own numbers, 0-based. Add
    `numberOffset` (from /names) to show the number a person sees. Levels are UI levels, the
    same numbers the rights lists use. A source of -1 means nothing is routed.

    Via note. Any request may carry `X-Sode-Via`, free text (32 printable characters) that
    Sode records beside the key name in the Communication Log, marked unverified. The key name
    itself is set when the key is made, so it is verified.

    Throttles. Each key has a rate limit per minute (the API settings default). A keyless
    call is limited per source address. Ten bad keys from one address in a minute make that
    address wait. Both answer 429 with `Retry-After` in seconds.

    CORS is off: no cross-origin headers are sent.

    Writes. A take request is its own Confirm: nothing asks a person, so guard the button on
    your side. The request is synchronous. It returns when the router has answered or timed
    out every route, with a Result per route and the History entry ids. One route can take
    about 35 seconds in the worst case (check 1 s, send queue up to 30 s, route 3 s, grace
    1 s), and a take of more than 8 routes runs them 8 at a time, so it can take longer.
    Common proxies cut a request at 60 seconds: raise the proxy's read timeout for
    `/api/v1`, or send an `Idempotency-Key` so a retry after a cut returns the first answer
    instead of taking twice. A route the router did not confirm in time is `failed` and may
    be confirmed later; the entry then updates on the stream and its id is in the response.
    Sode sets a write deadline on each take request itself and no server-wide write timeout,
    so `/ws` and the stream are not cut.

    Idempotency. `Idempotency-Key` (1 to 128 printable characters, no spaces) makes a repeated
    request with the same key from the same API key return the first answer, with
    `Idempotent-Replay: true`, for 10 minutes. The same key with a different request is
    refused with `idempotency_mismatch`. Requests that did nothing (bad input, rate limit,
    take cap) are not remembered, so a repeat runs. A call without an API key (a keyless
    Guest) cannot send `Idempotency-Key`: guests behind one address would share answers.

    Limits. Takes in flight across all callers are capped by the API settings take cap
    (default 4, because the router answers one message at a time): over it, 429
    `take_cap`. A request holds 1 to 200 routes.

    Large takes. A take of 6 or more routes does not read each destination from the router
    first, to spare it. The response carries `checkSkipped: true` then. Each entry's Prev
    comes from Sode's cache, which a change nobody announced can make stale, so a later Undo
    may restore less accurately. Take fewer than 6 routes per request to keep the check.

    Rights. A take with any route outside the key's rights is refused whole, before anything
    is sent: 403 `outside_rights`, no History entry, an `api` row in the Communication Log.
    Undo checks the destination and level but not the source it restores.

    Errors use the `Error` schema and a code from the table below.
  x-error-codes:
    api_off: 503, the API switch is off
    key_required: 401, no key and Guest API is off
    invalid_key: 401, the key is unknown, malformed or its owner is gone
    key_expired: 401, the key's expiry has passed
    rate_limited: 429, too many requests or too many bad keys from this address
    scope: 403, the key lacks the scope this path needs
    https_required: 403, Require HTTPS is on and the request did not arrive securely
    bad_request: 400, a parameter or body is not valid
    too_large: 413, the request body is over 64 KiB
    outside_rights: 403, a route or preset is outside the key's rights; nothing was sent (an Idempotency-Key repeat replays it)
    take_cap: 429, the global cap on API takes in flight is reached; retry shortly
    too_many_streams: 429, the key or the address already has 8 open streams
    conflict: 409, Redo of a failed entry or Retry of one that succeeded
    nothing_to_do: 422, the plan has no route left (nothing was routed before, or it no longer exists)
    idempotency_mismatch: 422, the Idempotency-Key was used for a different request
    not_found: 404, no such path
    method_not_allowed: 405, the path does not take this method
servers:
  - url: /api/v1
security:
  - bearer: []
  - {}
paths:
  /openapi.yaml:
    get:
      summary: This file
      security: []
      responses:
        "200":
          description: The OpenAPI document, open even while the API is off
          content:
            application/yaml:
              schema: { type: string }
  /names:
    get:
      summary: Source and destination names
      description: Scope `names`.
      responses:
        "200":
          description: Names as the router last reported them
          content:
            application/json:
              schema:
                type: object
                required: [numberOffset, sources, destinations, namesAt]
                properties:
                  numberOffset: { type: integer, description: Add to a router number to show it }
                  sources: { type: array, items: { $ref: "#/components/schemas/Name" } }
                  destinations: { type: array, items: { $ref: "#/components/schemas/Name" } }
                  namesAt: { type: string, format: date-time, description: When the names were last read, zero if never }
        default: { $ref: "#/components/responses/Error" }
  /tally:
    get:
      summary: What each destination is routed from, per level
      description: Scope `tally`.
      responses:
        "200":
          description: Levels and routes
          content:
            application/json:
              schema:
                type: object
                required: [levels, routes]
                properties:
                  levels:
                    type: array
                    items:
                      type: object
                      required: [level, label]
                      properties:
                        level: { type: integer, description: UI level, from 1 }
                        label: { type: string, description: How a person writes the level }
                  routes: { type: array, items: { $ref: "#/components/schemas/Route" } }
        default: { $ref: "#/components/responses/Error" }
  /protected:
    get:
      summary: Protected destinations
      description: Scope `protected`. A take to one is refused before anything is sent.
      responses:
        "200":
          description: Protected destination and level pairs
          content:
            application/json:
              schema:
                type: object
                required: [protected]
                properties:
                  protected: { type: array, items: { $ref: "#/components/schemas/ProtectedRow" } }
        default: { $ref: "#/components/responses/Error" }
  /presets:
    get:
      summary: Presets
      description: |
        Scope `presets`. Everyone presets for any caller, plus Me presets for a user's key.
        This browser presets live in a browser and are never listed.
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets: { type: array, items: { $ref: "#/components/schemas/Preset" } }
        default: { $ref: "#/components/responses/Error" }
  /history:
    get:
      summary: History, newest first, paged
      description: |
        Scope `history`. A page never ends inside a Group. Ask for the next page with
        `before` set to the id of the oldest entry returned.
      parameters:
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/N" }
      responses:
        "200":
          description: A page of History entries
          content:
            application/json:
              schema:
                type: object
                required: [before, entries, more]
                properties:
                  before: { type: integer, description: The page asked for, -1 for the newest }
                  entries: { type: array, items: { $ref: "#/components/schemas/Entry" } }
                  more: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /history/groups/last:
    get:
      summary: The most recent Group in History
      description: |
        Scope `history`. A Group is a take of several routes, so a caller can undo it by
        calling `/history/{id}/undo` for each returned entry. A take of one route is not a
        Group and is never returned here, and neither are External entries. The response
        is the newest Group that has a route the caller can see, with its entries in take
        order (oldest id first). For a caller with hidden visibility the entries are only
        the visible routes and `groupN` is absent, and a Group with no visible route is
        skipped for the next older one. 404 `not_found` when History has no such Group.
      responses:
        "200":
          description: The Group and its entries
          content:
            application/json:
              schema:
                type: object
                required: [group, entries]
                properties:
                  group: { type: string, description: The Group id, as `group` on each entry }
                  entries: { type: array, items: { $ref: "#/components/schemas/Entry" } }
        default: { $ref: "#/components/responses/Error" }
  /status:
    get:
      summary: Server link and Router link
      description: |
        Scope `status`. The same facts as `/api/health`, which stays open without a key. The
        router address and the error text name the router, so only a caller that also has
        the scope `log` gets `address` and `err`; everyone else gets the `error` flag.
      responses:
        "200":
          description: Link state
          content:
            application/json:
              schema:
                type: object
                required: [server, router, routerUp, error, version, uptimeSeconds]
                properties:
                  server: { type: string, enum: [up] }
                  router: { type: string, description: "up, connecting or down" }
                  routerUp: { type: boolean }
                  error: { type: boolean, description: The router link has a problem }
                  address: { type: string, description: Only with the scope `log` }
                  err: { type: string, description: Only with the scope `log` }
                  version: { type: string }
                  uptimeSeconds: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /layouts:
    get:
      summary: Panel layouts
      description: Scope `layouts`. Read-only. The content is not defined yet; the list is empty until then.
      responses:
        "200":
          description: Layouts
          content:
            application/json:
              schema:
                type: object
                required: [layouts]
                properties:
                  layouts: { type: array, items: { type: object } }
        default: { $ref: "#/components/responses/Error" }
  /log:
    get:
      summary: Communication Log, newest first, paged
      description: |
        Scope `log`. Shows raw router messages and API rows, so it ignores visibility. Ask
        for the next page with `before` set to the `seq` of the oldest row returned.
      parameters:
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/N" }
      responses:
        "200":
          description: A page of rows
          content:
            application/json:
              schema:
                type: object
                required: [before, entries, more, total]
                properties:
                  before: { type: integer }
                  entries: { type: array, items: { $ref: "#/components/schemas/LogRow" } }
                  more: { type: boolean }
                  total: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /takes:
    post:
      summary: Take by routes
      description: |
        Scope `take`. Synchronous, see Writes in the description. `levels` are UI levels;
        leave it out for the default levels. Always 200 once the take ran, even when a route
        failed: read each result. Refusals before anything is sent are errors.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routes]
              additionalProperties: false
              properties:
                routes:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [src, dst]
                    additionalProperties: false
                    properties:
                      src: { type: integer, description: "The router's number, 0-based" }
                      dst: { type: integer, description: "The router's number, 0-based" }
                      levels: { type: array, items: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/TakeResult" }
        default: { $ref: "#/components/responses/Error" }
  /presets/{scope}/{name}:
    post:
      summary: Take a preset
      description: |
        Scope `take`. `scope` is `everyone`, or `me` with a user's key. The preset fires only if
        every route is within the key's rights. Parts the router no longer has are left out and
        listed in `leftOut`. The body is ignored.
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string, enum: [everyone, me] } }
        - { name: name, in: path, required: true, schema: { type: string }, description: "The preset name, URL-encoded" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { $ref: "#/components/responses/TakeResult" }
        default: { $ref: "#/components/responses/Error" }
  /history/{id}/undo:
    post:
      summary: Undo a History entry
      description: |
        Scopes `take` and `history`. Restores what the router had before the entry, one route per previous
        source. Levels with nothing routed before, or that a failed take never changed, are left
        as is and listed in `skippedLevels` and `untouchedLevels`. 422 `nothing_to_do` when no
        level can be restored. Rights are checked on the destination and level, not on the
        source restored.
      parameters:
        - { $ref: "#/components/parameters/EntryId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { $ref: "#/components/responses/TakeResult" }
        default: { $ref: "#/components/responses/Error" }
  /history/{id}/redo:
    post:
      summary: Redo a successful History entry
      description: "Scopes `take` and `history`. Takes the entry's source to its destination again as a new take. 409 `conflict` for a failed entry (use retry)."
      parameters:
        - { $ref: "#/components/parameters/EntryId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { $ref: "#/components/responses/TakeResult" }
        default: { $ref: "#/components/responses/Error" }
  /history/{id}/retry:
    post:
      summary: Retry a failed History entry
      description: "Scopes `take` and `history`. Like redo, but linked to the failed entry. 409 `conflict` for an entry that succeeded."
      parameters:
        - { $ref: "#/components/parameters/EntryId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { $ref: "#/components/responses/TakeResult" }
        default: { $ref: "#/components/responses/Error" }
  /stream:
    get:
      summary: Live state over a WebSocket (version 1)
      description: |
        Upgrade to a WebSocket with the key in `Authorization: Bearer`. A browser cannot set
        that header, so use a client library. Choose topics at connect with `?topics=`, a
        comma list of `names`, `tally`, `status`, `history` and `results`. Each topic needs
        the scope of the same REST read (`results` needs `history`). A topic outside the
        key's scopes is refused with 403 `scope`, an unknown or missing topic with 400.

        The stream only sends; anything the client writes is ignored. Every frame is JSON
        `{"t", "topic"?, "data"?}`. `ping` is a heartbeat every 5 seconds, ignore it.

        - `hello`: first frame. `data` has `v` (1), `topics` and `numberOffset`.
        - `snapshot`: one each for `names`, `tally` and `status`, with `topic` set and
          `data` shaped like the REST read, so a client starts from a full state.
        - `names`: the full names again, after a refresh.
        - `tally`: `data.routes`, only the routes that changed.
        - `status`: `data` has `router`, `routerUp` and `error`, plus `address` and `err` for a caller with the scope `log`.
        - `entry`: a new History entry (topic `history`). `data` is an Entry.
        - `entryUpdate`: an entry changed after it was sent, for example a Late Result
          (a route confirmed after the take gave up). `data` is the whole entry. Sent
          once for a connection with `history`, `results` or both. A take request's
          response carries entry ids, so match updates by `id`.
        - `historyCleared`: History was emptied (topic `history`).

        Visibility. Under hidden rights nothing about an out-of-rights source or
        destination arrives: not in names, not in tally, not in an entry or update. A tally
        change whose source is hidden from the caller is left out, as `GET /tally` leaves
        that route out. A hidden entry
        never arrives, so ids can skip. A rights or scope change applies to an open stream
        at once, and a stream whose key lost a topic's scope, or whose API switch went off,
        is closed. A slow client is disconnected. A key or an address can hold 8 streams at
        a time, and a ninth is refused with 429 `too_many_streams`. Connects and
        disconnects are recorded as `api` rows in the Communication Log with the key name
        and, for a disconnect, the reason.
      parameters:
        - name: topics
          in: query
          required: true
          schema: { type: string, example: "names,tally,results" }
      responses:
        "101": { description: Switching protocols, the stream follows }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API key, shown once when it is made.
  parameters:
    Before:
      name: before
      in: query
      schema: { type: integer }
      description: Page cursor, see the path. Default is the newest page.
    N:
      name: n
      in: query
      schema: { type: integer, minimum: 1 }
      description: Page size. Defaults and caps differ per path (History 50 up to 500, log 100 up to 500).
    EntryId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 0 }
      description: A History entry id
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
      description: A repeat with the same key and request returns the first answer
  responses:
    TakeResult:
      description: The take ran. Each route has its own result.
      headers:
        Idempotent-Replay:
          schema: { type: string, enum: ["true"] }
          description: Present when this is a stored answer to an earlier request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TakeResult" }
    Error:
      description: An error, with the reason in `error.code`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    TakeResult:
      type: object
      required: [ok, checkSkipped, results]
      properties:
        ok: { type: boolean, description: Every route succeeded }
        checkSkipped: { type: boolean, description: "The destinations were not read from the router first (6 or more routes), so Prev may be stale" }
        results:
          type: array
          items:
            type: object
            required: [id, src, dst, levels, result, ok]
            properties:
              id: { type: integer, description: "Position in this request, from 1" }
              src: { type: integer }
              dst: { type: integer }
              levels: { type: array, items: { type: integer } }
              result: { type: string, enum: [connected, already, failed] }
              ok: { type: boolean }
              already: { type: array, items: { type: integer }, description: Levels already on the source }
              error: { type: string }
              entry: { type: integer, description: The History entry id; follow it for a late result }
        leftOut: { type: array, items: { type: string }, description: Preset parts the router no longer has }
        skippedLevels: { type: array, items: { type: integer }, description: Undo only }
        untouchedLevels: { type: array, items: { type: integer }, description: Undo only }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: See x-error-codes in info }
            message: { type: string }
    Name:
      type: object
      required: [n, name]
      properties:
        n: { type: integer }
        name: { type: string }
    Route:
      type: object
      required: [dst, level, src]
      properties:
        dst: { type: integer }
        level: { type: integer, description: UI level }
        src: { type: integer, description: -1 = nothing routed }
    ProtectedRow:
      type: object
      required: [dst, level]
      properties:
        dst: { type: integer }
        level: { type: integer, description: UI level }
    Preset:
      type: object
      required: [scope, name, items]
      properties:
        scope: { type: string, enum: [everyone, me] }
        name: { type: string }
        pinned: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              src: { type: integer }
              dsts: { type: array, items: { type: integer } }
              levels: { type: array, items: { type: integer }, description: Empty means the default levels }
    Actor:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [user, client] }
        name: { type: string }
        key: { type: string, description: The key name, verified }
        via: { type: string, description: The caller's own note, unverified }
    Entry:
      type: object
      description: One route of a take. Fields beyond these appear as they apply (Failed, Already, Late, Group, ...).
      required: [id, time, client, src, dst, levels, ok]
      properties:
        id: { type: integer }
        time: { type: string, format: date-time }
        client: { type: string, description: Who did it, a user, an API actor with key name, or an address }
        actor: { $ref: "#/components/schemas/Actor" }
        src: { type: integer }
        srcName: { type: string }
        dst: { type: integer }
        dstName: { type: string }
        levels: { type: array, items: { type: integer } }
        prev: { type: array, items: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }, description: "[UI level, src] before the take, -1 = nothing routed" }
        ok: { type: boolean }
        err: { type: string }
        undo: { type: integer }
        retry: { type: integer }
        group: { type: string }
        preset: { type: string }
        ext: { type: boolean, description: An External change }
    LogRow:
      type: object
      description: One Communication Log row, a router message or an event such as an `api` row.
      required: [seq, time, kind, result]
      properties:
        seq: { type: integer }
        time: { type: string, format: date-time }
        kind: { type: string }
        cmd: { type: integer, description: "SW-P-08 command number; -1 for an event" }
        level: { type: integer, description: "UI level; 0 when none" }
        wire: { type: integer, description: "Wire level; -1 when none" }
        dst: { type: integer, description: "-1 when none" }
        dstName: { type: string }
        src: { type: integer, description: "-1 when none" }
        srcName: { type: string }
        why: { type: string }
        by: { type: string }
        tries: { type: integer }
        result: { type: string }
        err: { type: string }
        note: { type: string }
        hex: { type: string, description: Empty for an event }
        ackMs: { type: number, description: How long the router took to ACK }
