openapi: 3.0.3
info:
  title: Sode API
  version: "1"
  description: |
    Read and command access to one SW-P-08 router through Sode. The API is off until an administrator
    turns it on in Settings. Served at /api/v1/openapi.yaml, always open. The guide with worked
    examples is docs/api.md in the Sode repository.

    Auth. Send a key as `Authorization: Bearer <key>` (`sode_` plus 43 URL-safe characters; treat it
    as opaque). A key is never accepted in a query string. A call with no Authorization header is
    a Guest call, allowed only while the Guest API switch is on, and only for the scopes Guest
    has been given. A 401 carries `WWW-Authenticate: Bearer`.

    Numbers. Sources and destinations are the router's own numbers, 0-based. Add `numberOffset`
    (from /names) to show the number a person sees; with an offset of 1, send `src: 0` for the
    source a person calls 1. Levels are UI levels from 1, never offset, the same numbers the
    rights lists use. A source of -1 means nothing is routed. A route that omits `levels`, or sends `[]`, uses
    the server's Default levels setting, which no endpoint reports, so always send `levels`.

    Via note. Any request may carry `X-Sode-Via`, free text (32 printable characters at most)
    that Sode records beside the key name in the Communication Log, marked unverified. The key
    name itself is set when the key is made, so it is verified.

    Throttles. Each key has a rate limit per minute (the API settings default 600). A keyless
    call is limited per source address. Ten bad keys from one address in a minute make that
    address wait. Both answer 429 `rate_limited` with `Retry-After` in seconds. CORS is off:
    no cross-origin headers are sent.

    Writes. A take request is its own Confirm: nothing asks a person, so guard the button on
    your side. The request is synchronous and returns when the router has answered or timed out
    every route, always 200 once the take ran, with a result per route and the History entry
    ids. One route can take about 35 seconds in the worst case (check 1 s, send queue up to
    30 s, route 3 s, grace 1 s); more than 8 routes run 8 at a time and take longer. Common
    proxies cut a request at 60 seconds, so raise the proxy's read timeout for `/api/v1`. A
    route the router did not confirm in time is `failed` and may be confirmed later: the entry
    then updates on the stream (match by `id`).

    Idempotency. `Idempotency-Key` (1 to 128 printable characters, no spaces) makes a repeat of
    the same request from the same API key return the first answer with `Idempotent-Replay:
    true` for 10 minutes. The same key with a different request is 422
    `idempotency_mismatch`. A request that did nothing (bad input, rate limit, take cap) is not
    remembered, except an `outside_rights` refusal, which is replayed. A keyless Guest cannot
    send the header (400 `bad_request`), because guests behind one address would share answers.

    Limits. Takes in flight across all callers are capped (default 4, because the router
    answers one message at a time): over it, 429 `take_cap`, with no `Retry-After`. A request
    holds 1 to 200 routes and a body of at most 64 KiB. A take of 6 or more routes does not
    read each destination first, to spare the router, and says `checkSkipped: true`; Prev then
    comes from Sode's cache, so a later Undo may restore less accurately.

    Rights. A take with any route outside the key's rights is refused whole, before anything is
    sent: 403 `outside_rights`, no results, no History entry, an `api` row in the Communication
    Log. Undo checks the destination and level but not the source it restores.

    Panels. Panels need the API switch: they use the same switch, scopes, rate limit and error
    shape as the rest of v1, and nothing under `/panels` answers while the API is off. A user's
    key has both panel scopes. An API client or Guest has them only if set. A panel belongs to
    a user. Its owner, or a Trusted user for anyone's, may change, delete and add artwork to it.
    Everyone else it is shared with, by name or as Everyone, may only read it and Save a copy.
    A panel the caller may not use is 404, never 403.
servers:
  - url: /api/v1
security:
  - bearer: []
  - {}
tags:
  - name: reads
    description: Current state and History
  - name: writes
    description: Takes, presets, Undo, Redo and Retry; scope `take`
  - name: panels
    description: Panels, their sharing and artwork; scopes `panels` and `panelsmanage`
  - name: stream
    description: Live changes over a WebSocket
paths:
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: The OpenAPI document
      security: []
      responses:
        "200":
          description: This document, open even while the API is off
          content:
            application/yaml:
              schema: { type: string }
  /names:
    get:
      operationId: listNames
      tags: [reads]
      summary: Source and destination names
      description: Scope `names`.
      responses:
        "200":
          description: Names as the router last reported them
          content:
            application/json:
              schema:
                type: object
                required: [numberOffset, sources, destinations, namesAt]
                properties:
                  numberOffset: { type: integer, description: Add to a router number to show it }
                  sources: { type: array, items: { $ref: "#/components/schemas/Name" } }
                  destinations: { type: array, items: { $ref: "#/components/schemas/Name" } }
                  namesAt: { type: string, format: date-time, description: When the names were last read, zero if never }
              example:
                numberOffset: 1
                sources: [{ n: 0, name: CAM 1 }, { n: 1, name: CAM 2 }]
                destinations: [{ n: 0, name: MON A }]
                namesAt: "2026-11-08T09:30:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /tally:
    get:
      operationId: getTally
      tags: [reads]
      summary: What each destination is routed from, per level
      description: Scope `tally`.
      responses:
        "200":
          description: Levels and routes
          content:
            application/json:
              schema:
                type: object
                required: [levels, routes]
                properties:
                  levels:
                    type: array
                    items:
                      type: object
                      required: [level, label]
                      properties:
                        level: { type: integer, description: UI level, from 1 }
                        label: { type: string, description: How a person writes the level }
                  routes: { type: array, items: { $ref: "#/components/schemas/Route" } }
              example:
                levels: [{ level: 1, label: "1" }]
                routes: [{ dst: 0, level: 1, src: 3 }]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /protected:
    get:
      operationId: listProtected
      tags: [reads]
      summary: Protected destinations
      description: Scope `protected`. A take to one is refused before anything is sent.
      responses:
        "200":
          description: Protected destination and level pairs
          content:
            application/json:
              schema:
                type: object
                required: [protected]
                properties:
                  protected: { type: array, items: { $ref: "#/components/schemas/ProtectedRow" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /presets:
    get:
      operationId: listPresets
      tags: [reads]
      summary: Presets
      description: |
        Scope `presets`. Everyone presets for any caller, plus Me presets for a user's key.
        This browser presets live in a browser and are never listed.
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets: { type: array, items: { $ref: "#/components/schemas/Preset" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /history:
    get:
      operationId: listHistory
      tags: [reads]
      summary: History, newest first, paged
      description: |
        Scope `history`. A page never ends inside a Group. Ask for the next page with
        `before` set to the id of the oldest entry returned.
      parameters:
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/N" }
      responses:
        "200":
          description: A page of History entries
          content:
            application/json:
              schema:
                type: object
                required: [before, entries, more]
                properties:
                  before: { type: integer, description: The page asked for, -1 for the newest }
                  entries: { type: array, items: { $ref: "#/components/schemas/Entry" } }
                  more: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /history/groups/last:
    get:
      operationId: getLastGroup
      tags: [reads]
      summary: The most recent Group in History
      description: |
        Scope `history`. A Group is a take of several routes, so a caller can undo it by
        calling `/history/{id}/undo` for each returned entry. A take of one route is not a
        Group and is never returned here, and neither are External entries. The response is
        the newest Group that has a route the caller can see, entries oldest id first. For a
        caller with hidden visibility the entries are only the visible routes and `groupN` is
        absent; a Group with no visible route is skipped for the next older one. 404
        `not_found` when History has no such Group.
      responses:
        "200":
          description: The Group and its entries
          content:
            application/json:
              schema:
                type: object
                required: [group, entries]
                properties:
                  group: { type: string, description: The Group id, as `group` on each entry }
                  entries: { type: array, items: { $ref: "#/components/schemas/Entry" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /status:
    get:
      operationId: getStatus
      tags: [reads]
      summary: Server link and Router link
      description: |
        Scope `status`. The same facts as `/api/health`, which stays open without a key. The
        router address and the error text name the router, so only a caller that also has
        the scope `log` gets `address` and `err`; everyone else gets the `error` flag.
      responses:
        "200":
          description: Link state
          content:
            application/json:
              schema:
                type: object
                required: [server, router, routerUp, error, version, uptimeSeconds]
                properties:
                  server: { type: string, enum: [up] }
                  router: { type: string, enum: [up, connecting, down] }
                  routerUp: { type: boolean }
                  error: { type: boolean, description: The router link has a problem }
                  address: { type: string, description: Only with the scope `log` }
                  err: { type: string, description: Only with the scope `log` }
                  version: { type: string }
                  uptimeSeconds: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /layouts:
    get:
      operationId: listLayouts
      tags: [reads]
      summary: Panel layouts
      description: Scope `layouts`. Read-only. The content is not defined yet; the list is empty until then.
      responses:
        "200":
          description: Layouts
          content:
            application/json:
              schema:
                type: object
                required: [layouts]
                properties:
                  layouts: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /log:
    get:
      operationId: listLog
      tags: [reads]
      summary: Communication Log, newest first, paged
      description: |
        Scope `log`. Shows raw router messages and API rows, so it ignores visibility. Ask
        for the next page with `before` set to the `seq` of the oldest row returned.
      parameters:
        - { $ref: "#/components/parameters/Before" }
        - { $ref: "#/components/parameters/N" }
      responses:
        "200":
          description: A page of rows
          content:
            application/json:
              schema:
                type: object
                required: [before, entries, more, total]
                properties:
                  before: { type: integer }
                  entries: { type: array, items: { $ref: "#/components/schemas/LogRow" } }
                  more: { type: boolean }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /takes:
    post:
      operationId: postTake
      tags: [writes]
      summary: Take by routes
      description: |
        Scope `take`. Synchronous, see Writes above. Always 200 once the take ran, even when a
        route failed: read each result. Refusals before anything is sent are errors.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routes]
              additionalProperties: false
              properties:
                routes:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [src, dst]
                    additionalProperties: false
                    properties:
                      src: { type: integer, description: "The router's number, 0-based" }
                      dst: { type: integer, description: "The router's number, 0-based" }
                      levels: { type: array, items: { type: integer }, description: "UI levels from 1; omitted or empty means the server's Default levels, so send them" }
            example:
              routes: [{ src: 1, dst: 0, levels: [1] }]
      responses:
        "200": { $ref: "#/components/responses/TakeResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /presets/{scope}/{name}:
    post:
      operationId: postPreset
      tags: [writes]
      summary: Take a preset
      description: |
        Scope `take`. `scope` is `everyone`, or `me` with a user's key. The preset fires only if
        every route is within the key's rights. Parts the router no longer has are left out and
        listed in `leftOut`. A caller with hidden visibility gets 404 `not_found` for a preset
        that `GET /presets` does not list. The body is ignored.
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string, enum: [everyone, me] } }
        - { name: name, in: path, required: true, schema: { type: string }, description: "The preset name, URL-encoded" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { $ref: "#/components/responses/TakeResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /history/{id}/undo:
    post:
      operationId: undoEntry
      tags: [writes]
      summary: Undo a History entry
      description: |
        Scopes `take` and `history`. Restores what the router had before the entry, one route per
        previous source. Levels with nothing routed before, or that a failed take never changed,
        are left as is and listed in `skippedLevels` and `untouchedLevels`. 422 `nothing_to_do`
        when no level can be restored.
      parameters:
        - { $ref: "#/components/parameters/EntryId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { $ref: "#/components/responses/TakeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /history/{id}/redo:
    post:
      operationId: redoEntry
      tags: [writes]
      summary: Redo a successful History entry
      description: "Scopes `take` and `history`. Takes the entry's source to its destination again as a new take. 409 `conflict` for a failed entry (use retry)."
      parameters:
        - { $ref: "#/components/parameters/EntryId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { $ref: "#/components/responses/TakeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /history/{id}/retry:
    post:
      operationId: retryEntry
      tags: [writes]
      summary: Retry a failed History entry
      description: "Scopes `take` and `history`. Like redo, but linked to the failed entry. 409 `conflict` for an entry that succeeded."
      parameters:
        - { $ref: "#/components/parameters/EntryId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { $ref: "#/components/responses/TakeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels:
    get:
      operationId: listPanels
      tags: [panels]
      summary: Panels this key may use
      description: |
        Scope `panels`. The panels the caller owns, the ones shared with it by name or with
        Everyone, and, for a Trusted user, every panel. A client also sees the panel it is the
        API client of. `canEdit` is false for a panel the caller may only use.
      responses:
        "200":
          description: Panels, by name
          content:
            application/json:
              schema:
                type: object
                required: [panels]
                properties:
                  panels: { type: array, items: { $ref: "#/components/schemas/Panel" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPanel
      tags: [panels]
      summary: Create a panel
      description: |
        Scope `panelsmanage`. Needs a user's key: the user becomes the owner (403 `user_required`
        for a client or Guest). Id, owner and artwork are set by Sode. Rows and columns default
        to 4 and 8, `acts` to `session` and `share` to `me`. At most 500 panels exist (409
        `conflict`). The body is at most 256 KiB.

        `acts: api` makes the panel an API client of its own, named `Panel <id>` and made with
        the panel. Only a Trusted user may (403 `trusted_required`). `clientRights` are its
        rights and default to the creator's; any list wider than the creator's own is 403
        `outside_rights`, and nothing is created. Its scopes start as names, tally, protected,
        status, presets, history, layouts, take and panels. Its keys are made elsewhere. It
        shows in the administrator's client list and does not count toward the limit of API
        clients.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PanelIn" }
            example: { name: Studio A, rows: 4, cols: 8, cells: [], settings: {} }
      responses:
        "201":
          description: The new panel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Panel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/people:
    get:
      operationId: listPanelPeople
      tags: [panels]
      summary: Users a panel may be shared with
      description: |
        Scope `panels`. Needs a user's key (403 `user_required` for an API client or Guest). The
        names of Sode's users, for the Share picker and nothing else: no PINs, flags or Rights.
        Put the names in a panel's `share.users` with `PUT /panels/{id}`.
      responses:
        "200":
          description: User names, in the order of the Users list
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required: [name]
                      properties:
                        name: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panel-templates:
    get:
      operationId: listPanelTemplates
      tags: [panels]
      summary: Templates this key may use
      description: |
        Scope `panels`. The Everyone templates, plus the caller's own Me templates for a user's
        key. By name.
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates: { type: array, items: { $ref: "#/components/schemas/PanelTemplate" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPanelTemplate
      tags: [panels]
      summary: Save a template
      description: |
        Scope `panelsmanage`. Needs a user's key (403 `user_required`). Saves a layout: rows,
        columns and each cell's type, levels and look. Cell contents (`n`, `scope`, `name`,
        `caption`) are dropped unless asked for: `sources` keeps those of Source and Preset cells,
        `dests` those of Destination cells, so by default every cell comes back unassigned. The
        older `contents: true` still works and means both. `settings` are kept when sent. Artwork ids are never kept, since artwork
        belongs to one panel. A name is unique within Everyone, or within one user's Me
        templates, ignoring case (409 `conflict`); at most 200 templates exist.

        Scope `everyone` needs a Trusted user, or the Advanced Settings PIN sent as `pin` in the
        body (403 `trusted_required`, also for a wrong PIN, which counts toward the PIN's
        lockout). The PIN is never stored. The body is at most 256 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PanelTemplateIn" }
            example: { name: Studio layout, scope: me, rows: 4, cols: 8, cells: [{ r: 1, c: 1, rs: 1, cs: 1, kind: source }] }
      responses:
        "201":
          description: The template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelTemplate" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panel-templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^t-[0-9a-f]{8}$" } }
    get:
      operationId: getPanelTemplate
      tags: [panels]
      summary: Read a template
      description: Scope `panels`. Another user's Me template is 404 `not_found`, as if it did not exist.
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePanelTemplate
      tags: [panels]
      summary: Delete a template
      description: Scope `panelsmanage`. The user who saved it, or a Trusted user for an Everyone template (403 `not_owner` otherwise).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
    get:
      operationId: getPanel
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^(p-[0-9a-f]{8}|[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?)$" } }
      tags: [panels]
      summary: Read a panel
      description: |
        Scope `panels`. `{id}` may also be the panel's short name (`slug`) on this route and on the
        setup route only; every other route takes the id. A panel the caller may not use is 404
        `not_found`, as if it did not exist, and an unknown short name answers the same way.
      responses:
        "200":
          description: The panel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Panel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updatePanel
      tags: [panels]
      summary: Update a panel
      description: |
        Scope `panelsmanage`. Replaces the panel with the body. Only the owner, or a Trusted user
        for anyone's, may (403 `not_owner` for a panel the caller may only use). Id, owner, API
        client and artwork cannot be changed here. A field Sode does not know that is stored on
        the panel and left out of the body is kept.

        `acts` decides the API client: `api` makes one if the panel has none, and `session`
        removes it with its keys. `clientRights` left out, or equal to the stored ones, change
        nothing. Any other value needs a Trusted caller and must be within the caller's own
        rights (403 `trusted_required`, `outside_rights`), and the panel is left as it was when
        refused. Only the Advanced Settings PIN widens a client past its creator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PanelIn" }
      responses:
        "200":
          description: The panel as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Panel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePanel
      tags: [panels]
      summary: Delete a panel
      description: Scope `panelsmanage`. The owner, or a Trusted user for anyone's. Its artwork goes with it.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}/copy:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
    post:
      operationId: copyPanel
      tags: [panels]
      summary: Save a copy
      description: |
        Scopes `panelsmanage` and `panels`. Needs a user's key and a panel the caller may use.
        Makes a panel the caller owns: private, acting as a session user, with the grid,
        settings and artwork of the source. The body is optional, `{"name":"..."}`; the default
        name is the source's name plus " copy".
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "201":
          description: The copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Panel" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}/push:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
    post:
      operationId: pushPanel
      tags: [panels]
      summary: Push a panel's saved layout to other panels
      description: |
        Scope `panelsmanage`. Copies the grid (`rows`, `cols`, `cells`), `settings` and unknown
        fields of the saved panel onto each target. Each target keeps its own `name`, `id`, `owner`
        and `share`. `acts`, the API client and its rights are never copied, so a Push cannot
        make a session panel act as an API client or widen a client; artwork the target lacks is
        copied. A checkpoint of each target is kept first. The caller must be able to change the
        source and every target (the owner, or a Trusted user for anybody's); if any target is
        refused, none is changed. Open panels update like a saved edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets: { type: array, minItems: 1, items: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
      responses:
        "200":
          description: Each target, its new `rev` and the checkpoint kept first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}/checkpoints:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
    get:
      operationId: listCheckpoints
      tags: [panels]
      summary: List a panel's checkpoints
      description: |
        Scope `panels`. Newest first, at most 10: the layouts the panel had before a Push or a
        restore. For the owner or a Trusted user.
      responses:
        "200":
          description: Checkpoints
          content:
            application/json:
              schema:
                type: object
                required: [checkpoints]
                properties:
                  checkpoints: { type: array, items: { $ref: "#/components/schemas/Checkpoint" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}/checkpoints/{cp}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
      - { name: cp, in: path, required: true, schema: { type: string, pattern: "^c-[0-9a-f]{8}$" } }
    post:
      operationId: restoreCheckpoint
      tags: [panels]
      summary: Put a checkpoint back
      description: |
        Scope `panelsmanage`. Restores the checkpoint's layout. What it replaces is kept as a new
        checkpoint, so a restore can be undone too. Name, sharing and the API client are untouched.
      responses:
        "200":
          description: The panel after the restore
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Panel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panel-sets:
    get:
      operationId: listCheckpointSets
      tags: [panels]
      summary: List checkpoint sets
      description: |
        Scope `panels`. The caller's own Me sets and every Everyone set. A user's key only; any
        other key gets an empty list.
      responses:
        "200":
          description: Checkpoint sets, without their cells
          content:
            application/json:
              schema:
                type: object
                required: [sets]
                properties:
                  sets: { type: array, items: { $ref: "#/components/schemas/CheckpointSet" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCheckpointSet
      tags: [panels]
      summary: Save a checkpoint set
      description: |
        Scope `panelsmanage`. Saves the listed panels' current saved layouts, one each. The caller
        must be able to change every panel listed. A set for `everyone` needs a Trusted user, or
        the Advanced Settings PIN sent as `pin` in the body (403 `trusted_required`, also for a
        wrong PIN, which counts toward the PIN's lockout). The PIN is never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, panels]
              properties:
                name: { type: string, maxLength: 60 }
                scope: { type: string, enum: [me, everyone], default: me }
                panels: { type: array, minItems: 1, items: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
                pin: { type: string, writeOnly: true, description: "The Advanced Settings PIN, for an Everyone set by a user who is not Trusted. Never stored" }
      responses:
        "201":
          description: The set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckpointSet" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panel-sets/{sid}:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, pattern: "^s-[0-9a-f]{8}$" } }
    put:
      operationId: updateCheckpointSet
      tags: [panels]
      summary: Rename a checkpoint set or save its layouts again
      description: |
        Scope `panelsmanage`. `name` renames it. `panels` replaces its entries with those panels'
        current saved layouts. The owner, or a Trusted user for an Everyone set, or anyone who sends
        the Advanced Settings PIN as `pin` for an Everyone set (403 `trusted_required` for a wrong
        one). The PIN is never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                panels: { type: array, minItems: 1, items: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
                pin: { type: string, writeOnly: true, description: "The Advanced Settings PIN, for an Everyone set by a user who is not Trusted. Never stored" }
      responses:
        "200":
          description: The set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckpointSet" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCheckpointSet
      tags: [panels]
      summary: Delete a checkpoint set
      description: |
        Scope `panelsmanage`. The owner, or a Trusted user for an Everyone set, or anyone who sends
        the Advanced Settings PIN as `pin` in a JSON body for an Everyone set (403
        `trusted_required` for a wrong one).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string, writeOnly: true, description: "The Advanced Settings PIN, for an Everyone set by a user who is not Trusted. Never stored" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panel-sets/{sid}/push:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, pattern: "^s-[0-9a-f]{8}$" } }
    post:
      operationId: pushCheckpointSet
      tags: [panels]
      summary: Push a checkpoint set
      description: |
        Scope `panelsmanage`. Gives each panel in the set its own saved layout, keeping a
        checkpoint of each first, with the same rules as pushing a panel. The caller must be able
        to change every panel pushed to. `targets` narrows it to some of the set's panels. A panel
        that no longer exists is skipped and listed in `skipped`. The body may be empty.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                targets: { type: array, items: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
      responses:
        "200":
          description: Panels pushed to and panels skipped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}/key:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
    post:
      operationId: makePanelKey
      tags: [panels]
      summary: Make or rotate the key of a named instance of a panel
      description: |
        Scope `panelsmanage`. Needs a user's key, and the panel's owner or a Trusted user. Only for
        a panel that acts as an API client (409 `conflict` otherwise). A panel holds one key per
        named instance, at most 20 (keys and pending setup links together; 409 `conflict` past
        that). `instance` is required (400 `bad_request`) and is also the instance's device name.
        Names are unique on the panel ignoring case, so a name that already holds a key rotates
        that instance only: its old key and open streams end and the other instances keep theirs.
        The new secret is shown this once and stored only as a hash. The key never expires. `link`
        is relative to Sode's root and carries the name in the query and the key in the URL
        fragment (`#key=`), so the key never reaches a request line, a proxy log or a Referer.
        Opening it runs the panel as its API client with no sign-in. A key in a query string is
        not a credential.

        With `{"setup": true}` in the body (secure mode) it ends that instance's key the same way
        and returns a one-time setup link instead of a key. The panel page posts the token to
        `POST /panels/{id}/setup` and keeps the key it gets in the browser, named for the
        instance, so the link works once and for one hour. A newer link or key for the same name,
        a revoke of it or deleting the panel ends it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instance]
              properties:
                instance: { type: string, maxLength: 40, description: The instance's name, also its device name }
                setup: { type: boolean, description: Make a one-time setup link, not a key }
      responses:
        "201":
          description: The new key, or with `setup` the new setup link
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string, description: The secret, shown once. Not in a setup answer }
                  id: { type: string, description: The key's id in the key list. Not in a setup answer }
                  instance: { type: string, description: The instance's name as stored }
                  rotated: { type: boolean, description: True when this instance's older key was ended }
                  link: { type: string, description: "`panels/<id>?instance=<name>#key=<secret>`, or with `setup` `panels/<id>?instance=<name>#setup=<token>`, relative to Sode's root. Sode's own pages build a shorter link: the short name when there is one, and the secret without its `sode_` or `sode_setup_` prefix" }
                  setup: { type: string, description: The one-time token, shown once. Only in a setup answer }
                  expires: { type: string, format: date-time, description: When the setup link stops working. Only in a setup answer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokePanelKey
      tags: [panels]
      summary: Revoke one instance's key
      description: |
        Scope `panelsmanage`, owner or Trusted, a user's key. Ends the named instance's key, any
        pending setup link for it and its open streams. The panel, its API client and the other
        instances stay. Revoking an instance that has none is a 204 too.
      parameters:
        - { name: instance, in: query, required: true, schema: { type: string, maxLength: 40 }, description: The instance's name, ignoring case }
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}/keys:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
    get:
      operationId: listPanelKeys
      tags: [panels]
      summary: List a panel's instances
      description: |
        Scope `panelsmanage`, owner or Trusted, a user's key, a panel that acts as an API client
        (409 `conflict` otherwise). One row per named instance: a key, or a one-time setup link
        that has not been used. Never a secret. `online` is true while a screen with that device
        name counts as online.
      responses:
        "200":
          description: The instances, by name, and the limit
          content:
            application/json:
              schema:
                type: object
                required: [keys, max]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [id, name, created, online]
                      properties:
                        id: { type: string }
                        name: { type: string, description: The instance's name }
                        created: { type: string, format: date-time }
                        lastUsed: { type: string, format: date-time, description: Absent until the key is first used }
                        online: { type: boolean }
                        setup: { type: boolean, description: True when only a one-time setup link is pending }
                        expires: { type: string, format: date-time, description: When a pending setup link stops working }
                  max: { type: integer, description: The most instances a panel may hold }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}/setup:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^(p-[0-9a-f]{8}|[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?)$" } }
    post:
      operationId: exchangePanelSetup
      tags: [panels]
      summary: Trade a one-time setup link for an instance's key
      security: []
      description: |
        Needs no key (route scope `none`): the token is the credential. It works once, for an hour.
        The answer is a new key for the instance the link was made for, shown this once. A token that was used,
        expired or replaced is 401 `invalid_setup`. Wrong tokens count against the same
        per-address limit as wrong keys (429 `rate_limited`). From outside the panel's allowed
        networks it is 403 `network_not_allowed` and the link stays usable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setup]
              properties:
                setup: { type: string, description: The token from the `#setup=` fragment }
      responses:
        "201":
          description: The new key
          content:
            application/json:
              schema:
                type: object
                required: [key, id]
                properties:
                  key: { type: string }
                  id: { type: string }
                  instance: { type: string, description: The instance's name, which is also the key's name }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}/networks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
    put:
      operationId: setPanelNetworks
      tags: [panels]
      summary: Set the networks a panel's key may be used from
      description: |
        Scope `panelsmanage`, owner or Trusted, a user's key, a panel that acts as an API client
        (409 `conflict` otherwise). Replaces the list on the panel's API client. Each entry is a
        CIDR such as `192.168.1.0/24` or `2001:db8::/32`; a bare address means that one host. Entries
        are stored masked and canonical, at most 16. An empty list lifts the limit. A request with
        the panel's key from an address outside the list is 403 `network_not_allowed`.
        The setting does not touch the key, and is not checked against the caller's own address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [networks]
              properties:
                networks: { type: array, items: { type: string }, maxItems: 16 }
      responses:
        "200":
          description: The list as stored
          content:
            application/json:
              schema:
                type: object
                required: [networks]
                properties:
                  networks: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /panels/{id}/instances:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
    post:
      operationId: panelKeepalive
      tags: [panels]
      summary: Report an open panel page (keepalive)
      description: |
        Scope `panels`. Anyone who may use the panel counts. Each open panel page is an
        instance named by its device, and sends this every 15 seconds. A panel is online while
        any device was heard in the last 45 seconds (8 seconds after a device closed its
        stream, see `/panels/{id}/instances/stream`). A device that is silent for longer raises a notice for the panel's watchers, and a second one when it returns
        (see the `panelNotice` frame of the Sode socket in docs/api.md). Devices are kept in
        memory only and told apart by name, ignoring case, so two screens that share a name are
        one instance. A panel holds at most 100 devices (409 `conflict`). Deleting the panel, and
        making, rotating or revoking its key, forgets its devices without a notice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device: { type: string, maxLength: 40, description: A name for this screen }
      responses:
        "200":
          description: Heard
          content:
            application/json:
              schema:
                type: object
                required: [online, keepaliveSeconds, missSeconds]
                properties:
                  online: { type: boolean }
                  keepaliveSeconds: { type: integer, description: How often to send this }
                  missSeconds: { type: integer, description: How long a silence may last }
                  graceSeconds: { type: integer, description: How long after a closed stream the device counts as online }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}/instances/stream:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
    get:
      operationId: panelInstanceStream
      tags: [panels]
      summary: Hold a connection for an open panel page
      description: |
        Scope `panels`. Read it with `fetch` and the Authorization header (an EventSource cannot
        send one). The answer stays open and carries a line every 10 seconds, so Sode sees the
        page close at once. A device that held a stream and closed it is lost after 8 seconds,
        not the 45 of the keepalive, and a reopen with the same name inside that time raises
        nothing. Keep sending the keepalive: it is the fallback when the stream cannot stay open.
      parameters:
        - { name: device, in: query, required: true, schema: { type: string, maxLength: 40 }, description: A name for this screen }
      responses:
        "200":
          description: Held; one JSON line at once and one every 10 seconds
          content:
            application/x-ndjson:
              schema:
                type: object
                required: [online, graceSeconds]
                properties:
                  online: { type: boolean }
                  graceSeconds: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}/watch:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
    post:
      operationId: watchPanel
      tags: [panels]
      summary: Watch a panel
      description: |
        Scope `panels`. Needs a user's key (403 `user_required`). A user watches the panels they
        own and a Trusted user any panel (403 `not_owner` for a use-only panel). A watcher is
        told when a device of the panel is lost (a closed page after 8 seconds, a silent one
        after 45) and when it returns, through the Sode socket as a toast, a banner and, if the
        browser allows, a notification. The list lives in `panelwatch.yaml` beside the config. Watching twice is a
        204 too.
      responses:
        "204": { description: Watching }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: unwatchPanel
      tags: [panels]
      summary: Stop watching a panel
      description: Scope `panels`. Same caller rules as watching. Not watching is a 204 too.
      responses:
        "204": { description: Not watching }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}/artwork:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
    post:
      operationId: uploadPanelArtwork
      tags: [panels]
      summary: Add artwork to a panel
      description: |
        Scope `panelsmanage`, owner or Trusted. The body is the image itself, at most 1 MB
        (413 `too_large`), a JPEG, PNG, GIF or SVG. The type is decided by the bytes, never by the
        request's Content-Type or a file name; anything else is 415 `unsupported_type`. A panel
        holds at most 40 files (409 `conflict`).
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          image/svg+xml: { schema: { type: string, format: binary } }
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: The stored artwork; cells name it by `id`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelArt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /panels/{id}/artwork/{art}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^p-[0-9a-f]{8}$" } }
      - { name: art, in: path, required: true, schema: { type: string, pattern: "^a-[0-9a-f]{8}$" } }
    get:
      operationId: getPanelArtwork
      tags: [panels]
      summary: Fetch artwork
      description: |
        Scope `panels`. Serves the stored type with `X-Content-Type-Options: nosniff` and a
        Content-Security-Policy of `default-src 'none'; style-src 'unsafe-inline'; sandbox`, so a
        script in an SVG never runs. Show it as an image, never inline. The key goes in the
        Authorization header, so fetch it and show the bytes, not a bare image URL.
      responses:
        "200":
          description: The image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePanelArtwork
      tags: [panels]
      summary: Remove artwork
      description: Scope `panelsmanage`, owner or Trusted.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /stream:
    get:
      operationId: openStream
      tags: [stream]
      summary: Live state over a WebSocket (version 1)
      description: |
        Upgrade to a WebSocket with the key in `Authorization: Bearer`. A browser cannot set
        that header, so use a client library. Choose topics at connect with `?topics=`, a
        comma list of `names`, `tally`, `status`, `history` and `results`. Each topic needs
        the scope of the same REST read (`results` needs `history`). A topic outside the key's
        scopes is refused with 403 `scope`, an unknown or missing topic with 400.

        The stream only sends; anything the client writes is ignored. Every frame is JSON
        `{"t", "topic"?, "data"?}`. `ping` is a heartbeat every 5 seconds, ignore it.

        - `hello`: first frame. `data` has `v` (1), `topics` and `numberOffset`.
        - `snapshot`: one each for `names`, `tally` and `status`, with `topic` set and `data`
          shaped like the REST read, so a client starts from a full state. There is none for
          `history`: read `GET /history` first and bridge by id.
        - `names`: the full names again, after a refresh.
        - `tally`: `data.routes`, only the routes that changed.
        - `status`: `data` has `router`, `routerUp` and `error`, plus `address` and `err` for a
          caller with the scope `log`.
        - `entry`: a new History entry (topic `history`). `data` is an Entry.
        - `entryUpdate`: an entry changed after it was sent, for example a Late Result (a route
          confirmed after the take gave up). `data` is the whole Entry. Sent once for a
          connection with `history`, `results` or both; `results` alone suits a client that
          fires takes and wants only Late Results. Match updates by `id`.
        - `historyCleared`: History was emptied (topic `history`).

        Example frames:

            {"t":"hello","data":{"v":1,"topics":["tally"],"numberOffset":1}}
            {"t":"snapshot","topic":"tally","data":{"levels":[{"level":1,"label":"1"}],"routes":[{"dst":0,"level":1,"src":3}]}}
            {"t":"tally","topic":"tally","data":{"routes":[{"dst":0,"level":1,"src":1}]}}

        Visibility. Under hidden rights nothing about an out-of-rights source or destination
        arrives: not in names, not in tally, not in an entry or update. A tally change whose
        source is hidden from the caller is left out, as `GET /tally` leaves that route out. A
        hidden entry never arrives, so ids can skip. A rights or scope change applies to an
        open stream at once, to later frames only: the client keeps what it holds until it
        reconnects. A stream whose key lost a topic's scope, or whose API switch went off, is
        closed.

        Lifetime. A key or an address can hold 8 streams at a time, and a ninth is refused
        with 429 `too_many_streams`. A panel's own API client key may hold 64, since its
        kiosks share it, and those streams do not count toward an address's 8. A client is dropped when a frame write stalls for 5
        seconds or 256 frames are queued. Connects and disconnects are `api` rows in the
        Communication Log with the key name and, for a disconnect, the reason.
      parameters:
        - name: topics
          in: query
          required: true
          schema: { type: string, example: "names,tally,results" }
      responses:
        "101": { description: Switching protocols, the stream follows }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API key, shown once when it is made.
  parameters:
    Before:
      name: before
      in: query
      schema: { type: integer }
      description: Page cursor, see the path. Default is the newest page.
    N:
      name: n
      in: query
      schema: { type: integer, minimum: 1 }
      description: Page size. Defaults and caps differ per path (History 50 up to 500, log 100 up to 500).
    EntryId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 0 }
      description: A History entry id
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: A repeat with the same key and request returns the first answer, see Idempotency above
  responses:
    TakeResult:
      description: The take ran. Each route has its own result.
      headers:
        Idempotent-Replay:
          schema: { type: string, enum: ["true"] }
          description: Present when this is a stored answer to an earlier request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TakeResult" }
          example:
            ok: true
            checkSkipped: false
            results: [{ id: 1, src: 1, dst: 0, levels: [1], result: connected, ok: true, entry: 412 }]
    Unauthorized:
      description: "`key_required`, `invalid_key` or `key_expired`; carries `WWW-Authenticate: Bearer`"
      headers:
        WWW-Authenticate: { schema: { type: string, enum: [Bearer] } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`scope` (the key lacks the scope), `outside_rights` (a route or preset is outside the rights, nothing was sent), `https_required`, `not_owner` (a panel the caller may only use), `user_required` (a panel needs a user's key to own it) or `trusted_required` (only a Trusted user may make a panel an API client or change its rights, or save a template to Everyone without the Advanced Settings PIN)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: "`rate_limited` (carries `Retry-After` in seconds), `take_cap` (retry in a second or two; no `Retry-After`) or `too_many_streams`"
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds; only on rate_limited }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: An error, with the reason in `error.code`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    TakeResult:
      type: object
      required: [ok, checkSkipped, results]
      properties:
        ok: { type: boolean, description: Every route succeeded }
        checkSkipped: { type: boolean, description: "The destinations were not read from the router first (6 or more routes), so Prev may be stale" }
        results:
          type: array
          items:
            type: object
            required: [id, src, dst, levels, result, ok]
            properties:
              id: { type: integer, description: "Position in this request, from 1" }
              src: { type: integer }
              dst: { type: integer }
              levels: { type: array, items: { type: integer } }
              result: { type: string, enum: [connected, already, failed] }
              ok: { type: boolean }
              already: { type: array, items: { type: integer }, description: Levels already on the source }
              error: { type: string }
              entry: { type: integer, description: The History entry id; follow it for a late result }
        leftOut: { type: array, items: { type: string }, description: Preset parts the router no longer has }
        skippedLevels: { type: array, items: { type: integer }, description: Undo only }
        untouchedLevels: { type: array, items: { type: integer }, description: Undo only }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - api_off
                - key_required
                - invalid_key
                - key_expired
                - rate_limited
                - scope
                - https_required
                - bad_request
                - too_large
                - outside_rights
                - take_cap
                - too_many_streams
                - conflict
                - nothing_to_do
                - idempotency_mismatch
                - not_found
                - method_not_allowed
                - not_owner
                - user_required
                - trusted_required
                - unsupported_type
                - invalid_setup
                - network_not_allowed
                - internal
              description: |
                503 api_off (the API switch is off). 401 key_required, invalid_key, key_expired,
                invalid_setup (a setup link that was used, expired or replaced).
                403 network_not_allowed (the key's address is outside the panel's allowed networks),
                scope, outside_rights, https_required, not_owner (a panel the caller may only
                use), user_required (a panel needs a user's key), trusted_required (only a Trusted
                user may make a panel an API client or change its rights). 400 bad_request. 413 too_large
                (body over 64 KiB for a take, 256 KiB for a panel, 1 MB for artwork). 415
                unsupported_type (artwork that is not a JPEG, PNG, GIF or SVG). 404 not_found (no
                such path, entry, visible preset, or a panel or artwork the caller may not use).
                405 method_not_allowed (see `Allow`). 409 conflict (Redo of a failed entry, Retry of
                a successful one, or a full panel or artwork limit). 422 nothing_to_do (no route
                left to run), idempotency_mismatch. 429 rate_limited, take_cap, too_many_streams.
                500 internal (a panel could not be written to disk).
            message: { type: string }
    PanelShare:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [me, named, everyone], description: "Only me, named users, or Everyone; all of them use only" }
        users: { type: array, items: { type: string }, description: Only with `named` }
    PanelArt:
      type: object
      required: [id, type, size]
      properties:
        id: { type: string, pattern: "^a-[0-9a-f]{8}$" }
        type: { type: string, enum: [image/png, image/jpeg, image/gif, image/svg+xml] }
        size: { type: integer, description: Bytes }
    PanelIn:
      type: object
      description: |
        A panel as sent. Unknown fields are kept and returned, so a newer client's data survives.
        `id`, `owner`, `client`, `art`, `rev` and `canEdit` are ignored here. `clientRights` is for a
        panel with `acts: api`.
      required: [name]
      additionalProperties: true
      properties:
        name: { type: string, maxLength: 60 }
        slug:
          type: string
          maxLength: 32
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$"
          description: |
            Optional short name. The panel also opens at `/panels/<slug>` and is read at
            `GET /panels/<slug>`. Unique across panels (409 `conflict`), never `editor` or shaped
            like an id. Leaving it out of a save clears it, and changing or clearing it stops every
            link that used the old one; links by id keep working. A copy starts without one.
        acts: { type: string, enum: [session, api], default: session }
        share: { $ref: "#/components/schemas/PanelShare" }
        rows: { type: integer, minimum: 1, maximum: 24, default: 4 }
        cols: { type: integer, minimum: 1, maximum: 24, default: 8 }
        cells: { type: array, items: { type: object, additionalProperties: true }, maxItems: 576 }
        settings: { type: object, additionalProperties: true }
        clientRights:
          type: object
          description: |
            Rights of the panel's API client. An unset list means everything, an empty one
            nothing. Returned only to a caller who may edit the panel.
          properties:
            sources: { type: array, items: { type: integer } }
            dsts: { type: array, items: { type: integer } }
            levels: { type: array, items: { type: integer }, description: UI levels }
            presets: { type: array, items: { type: string } }
            visibility: { type: string, enum: [readonly, hidden] }
    PanelTemplateIn:
      type: object
      required: [name, scope]
      properties:
        name: { type: string, maxLength: 60 }
        scope: { type: string, enum: [me, everyone] }
        rows: { type: integer, minimum: 1, maximum: 24, default: 4 }
        cols: { type: integer, minimum: 1, maximum: 24, default: 8 }
        cells:
          type: array
          items: { type: object, additionalProperties: true, description: A cell as a panel stores it }
        settings: { type: object, additionalProperties: true, description: Panel settings to carry, left out for a layout only }
        sources: { type: boolean, default: false, description: "Keep the Source and Preset cells' Sources, Presets and captions" }
        dests: { type: boolean, default: false, description: "Keep the Destination cells' Destinations and captions" }
        contents: { type: boolean, default: false, writeOnly: true, deprecated: true, description: "The single flag from before the split: true means both sources and dests. Never sent back" }
        pin: { type: string, writeOnly: true, description: "The Advanced Settings PIN, for scope everyone by a user who is not Trusted" }
    PanelTemplate:
      allOf:
        - $ref: "#/components/schemas/PanelTemplateIn"
        - type: object
          required: [id, owner, sources, dests, canEdit]
          properties:
            id: { type: string, pattern: "^t-[0-9a-f]{8}$" }
            owner: { type: string, description: The user who saved it }
            canEdit: { type: boolean, description: True when the caller may delete it }
    Panel:
      allOf:
        - $ref: "#/components/schemas/PanelIn"
        - type: object
          required: [id, owner, rev, canEdit]
          properties:
            rev:
              type: integer
              minimum: 1
              description: |
                Counts the panel's stored changes (a save, artwork, a Push). A panel page that is open
                reads the panel every 5 seconds and updates itself when `rev` moves.
            id: { type: string, pattern: "^p-[0-9a-f]{8}$" }
            owner: { type: string, description: The user who owns it }
            client: { type: string, description: The API client of a panel that acts as one }
            art: { type: array, items: { $ref: "#/components/schemas/PanelArt" } }
            canEdit: { type: boolean, description: False when the caller may only use the panel }
            hasKey: { type: boolean, description: "For an editor of an API panel: the client holds a key now. A pending setup link is not a key. The secret itself is never returned." }
            clientNetworks:
              type: array
              items: { type: string }
              description: "For an editor of an API panel: the allowed networks as CIDRs, empty = anywhere"
            online: { type: boolean, description: Output only. A device was heard in the last 45 seconds, on a list or a read }
            watching: { type: boolean, description: Output only. The calling user watches it; never a list of watchers }
            instances:
              type: array
              description: Output only, for an editor. The devices that have opened the panel since Sode started
              items:
                type: object
                required: [device, seen, online]
                properties:
                  device: { type: string }
                  seen: { type: string, format: date-time }
                  online: { type: boolean }
            rights:
              type: object
              description: |
                The calling key's own Rights, so a panel page can refuse a route before arming
                a take. Only on `GET /panels/{id}`. The server enforces them regardless.
              properties:
                sources: { type: array, items: { type: integer } }
                dsts: { type: array, items: { type: integer } }
                levels: { type: array, items: { type: integer }, description: UI levels }
                presets: { type: array, items: { type: string } }
                visibility: { type: string, enum: [readonly, hidden] }
    PushResult:
      type: object
      required: [pushed]
      properties:
        pushed:
          type: array
          items:
            type: object
            required: [panel, rev, checkpoint]
            properties:
              panel: { type: string }
              rev: { type: integer }
              checkpoint: { type: string, pattern: "^c-[0-9a-f]{8}$" }
        skipped:
          type: array
          description: Only from a checkpoint set push
          items:
            type: object
            required: [panel, reason]
            properties:
              panel: { type: string }
              reason: { type: string }
    Checkpoint:
      type: object
      required: [id, at, by, why, rows, cols, cells]
      properties:
        id: { type: string, pattern: "^c-[0-9a-f]{8}$" }
        at: { type: string, format: date-time }
        by: { type: string, description: The user who pushed or restored }
        why: { type: string }
        rows: { type: integer }
        cols: { type: integer }
        cells: { type: integer, description: How many cells the layout has }
    CheckpointSet:
      type: object
      required: [id, name, scope, owner, entries, canEdit]
      properties:
        id: { type: string, pattern: "^s-[0-9a-f]{8}$" }
        name: { type: string }
        scope: { type: string, enum: [me, everyone] }
        owner: { type: string }
        canEdit: { type: boolean }
        entries:
          type: array
          items:
            type: object
            required: [panel, name, rows, cols, cells]
            properties:
              panel: { type: string, description: The panel this layout belongs to }
              name: { type: string, description: The panel's name when saved }
              rows: { type: integer }
              cols: { type: integer }
              cells: { type: integer }
    Name:
      type: object
      required: [n, name]
      properties:
        n: { type: integer }
        name: { type: string }
    Route:
      type: object
      required: [dst, level, src]
      properties:
        dst: { type: integer }
        level: { type: integer, description: UI level }
        src: { type: integer, description: -1 = nothing routed }
    ProtectedRow:
      type: object
      required: [dst, level]
      properties:
        dst: { type: integer }
        level: { type: integer, description: UI level }
    Preset:
      type: object
      required: [scope, name, items]
      properties:
        scope: { type: string, enum: [everyone, me] }
        name: { type: string }
        pinned: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              src: { type: integer }
              dsts: { type: array, items: { type: integer } }
              levels: { type: array, items: { type: integer }, description: Empty means the default levels }
    Actor:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [user, client, guest] }
        name: { type: string }
        key: { type: string, description: The key name, verified }
        owner: { type: string, description: "For a panel's own API client, the user who made it; `client` then reads \"Seth (Panel p-1a2b3c4d)\"" }
        via: { type: string, description: The caller's own note, unverified }
    Entry:
      type: object
      description: One route of a take. Optional fields appear only when they apply.
      required: [id, time, client, src, srcName, dst, dstName, levels, prev, ok]
      properties:
        id: { type: integer }
        time: { type: string, format: date-time }
        client: { type: string, description: Who did it, a user, an API actor with key name, or an address }
        actor: { $ref: "#/components/schemas/Actor" }
        src: { type: integer }
        srcName: { type: string }
        dst: { type: integer }
        dstName: { type: string }
        levels: { type: array, items: { type: integer } }
        prev: { type: array, items: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }, description: "[UI level, src] before the take, -1 = nothing routed" }
        ok: { type: boolean }
        err: { type: string }
        failed: { type: array, items: { type: integer }, description: Levels the router never confirmed, or that were not sent }
        now: { type: array, items: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }, description: "[UI level, src] the router reported for the failed levels afterwards, -1 = nothing routed; absent when it gave no answer" }
        already: { type: array, items: { type: integer }, description: Levels that were already on src }
        late: { type: array, items: { type: integer }, description: Levels that were failed until the router confirmed them after the take gave up }
        unsent: { type: array, items: { type: integer }, description: Levels never sent }
        sendErr: { type: string, description: Why a level was not sent }
        cut: { type: boolean, description: The router changed under the take, so its failed levels just got no answer }
        undo: { type: integer, description: The id of the entry this one undid }
        retry: { type: integer, description: The id of the failed entry this one retries }
        group: { type: string, description: Entries of one take of several routes share it }
        groupN: { type: integer, description: Routes in the Group; absent for a hidden caller }
        preset: { type: string, description: The preset this take was fired from }
        ext: { type: boolean, description: An External change }
        found: { type: boolean, description: External only, changed without a Connected and seen when Sode re-read the router }
        follow: { type: integer, description: External only, the id of the take this seems to follow }
        followGroup: { type: string, description: External only, the Group of that take }
    LogRow:
      type: object
      description: One Communication Log row, a router message or an event such as an `api` row.
      required: [seq, time, kind, cmd, level, wire, dst, src, tries, result, hex]
      properties:
        seq: { type: integer }
        time: { type: string, format: date-time }
        kind: { type: string }
        cmd: { type: integer, description: "SW-P-08 command number; -1 for an event" }
        level: { type: integer, description: "UI level; 0 when none" }
        wire: { type: integer, description: "Wire level; -1 when none" }
        dst: { type: integer, description: "-1 when none" }
        dstName: { type: string }
        src: { type: integer, description: "-1 when none" }
        srcName: { type: string }
        why: { type: string }
        by: { type: string }
        tries: { type: integer }
        result: { type: string }
        err: { type: string }
        note: { type: string }
        hex: { type: string, description: Empty for an event }
        ackMs: { type: number, description: How long the router took to ACK }
