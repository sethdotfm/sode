# Sode settings. Edited by the settings dialog; hand edits apply on restart.
format: 2
routers:
    - uid: r-fixture
      prefix: A
      title: ""
      address: 127.0.0.1:8910
      statusLabel: address
      matrix: 0
      levels: 17
      levelOffset: -1
      levelNumbering: "1"
      numberOffset: 1
      defaultLevels: 1-17
      nameLength: 12
      nameRequests: std
      nameRereadSeconds: 60
      routeRereadSeconds: 300
      fireMode: sequential
      salvoGroup: 127
installUid: i-fixture
confirmLockoutMs: 500
resultDismissSeconds: 8
confirmEnter: false
trustedProxies: []
levelColors: []
pinWaits: true
browserDefaults:
    theme: system
    layout: auto
    clock: "24"
    flip: false
    scrollTop: true
    searchFilters: false
    setStack: and
    nextMode: number
    stackGap: "30"
    compact: false
users:
    - id: u1
      name: Ada
      pin: pbkdf2-sha256$600000$LJAgyVnr5tWMnWwUkM8Jpg$St7Mo9ZxvnkdprHR9BATiIts6qyAHYjaTOmWpu+bqsg
      len: 4
      role: administrator
locks:
    main: false
    log: false
    panel: false
autoLockMinutes: 0
maxPinLen: 8
api:
    rateLimit: 600
    takeCap: 4
    guestEnabled: false
    logReads: false
guestRole: standard
guestApiScopes:
    - names
    - tally
    - protected
    - status
publicPanels: true
newPanelActs: public
requireHttps: false
