    log: false
    panel: false
autoLockMinutes: 0
maxPinLen: 8
api:
    rateLimit: 600
    takeCap: 4
    guestEnabled: false
    logReads: false
guestRole: standard
guestApiScopes:
    - names
    - tally
    - protected
    - status
publicPanels: true
newPanelActs: public
requireHttps: false
