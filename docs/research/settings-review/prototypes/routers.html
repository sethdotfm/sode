<script>
// Shared prototype helpers. Fake data only.
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const icon = (name, sm) => `<svg class="pb-icon${sm ? ' pb-icon--sm' : ''}" viewBox="0 0 24 24" aria-hidden="true"><use href="#${name}"/></svg>`;

const TITLES = [
  'MCR Production Ultrix', 'Studio 4 Gallery Audio', 'Transmission Backup Matrix', 'Edit Suites North Wing', 'OB Truck Unit 7',
  'Stage 1 Small', 'Master Control Monitor Wall', 'Studio C', 'Truck Dock', 'Flypack', 'Audio Desk Bridge', 'Edit Suites South Wing',
  'Ingest', 'Playout Chain A', 'Playout Chain B', 'QC Room', 'Newsroom', 'Studio 4 Gallery Video', 'Graphics', 'Radio 1', 'Radio 2',
  'Archive', 'Playout Chain A Distribution', 'Lines Room',
];
const LEVELS = [17, 16, 17, 4, 8, 2, 17, 8, 2, 1, 16, 4, 17, 17, 17, 4, 8, 17, 4, 2, 2, 1, 17, 32];
const prefixOf = (i) => String.fromCharCode(65 + i);

// The routers that are not up, for each count. Every prototype uses this, so a link between two of them agrees.
const LOST = { 1: {}, 2: { B: 'down' }, 3: { B: 'down', C: 'connecting' }, 4: { B: 'down' }, 12: { C: 'down', G: 'never', K: 'connecting' }, 24: { B: 'down', E: 'down', L: 'down', R: 'never', W: 'down' } };

function makeRouters(n, lost = LOST[n] || {}) {
  return Array.from({ length: n }, (_, i) => {
    const p = prefixOf(i);
    const link = lost[p] || 'up';
    return {
      uid: 'a' + (0x51c3 + i * 7919).toString(16) + 'e2',
      prefix: p,
      title: TITLES[i],
      address: `10.20.${4 + (i >> 3)}.${11 + i}:8910`,
      matrix: i === 2 ? 1 : 0,
      levels: LEVELS[i],
      levelOffset: i % 5 === 1 ? 0 : -1,
      levelNumbering: i === 3 ? '0' : i === 5 ? 'va' : '1',
      defaultLevels: i === 1 ? '1-4' : '',
      numberOffset: 1,
      nameLength: 12,
      nameRequests: 'std',
      nameRereadSeconds: 60,
      routeRereadSeconds: 300,
      fireMode: 'sequential',
      salvoGroup: 127,
      protectDevice: i === 3 ? 0 : 200 + i,
      statusLabel: 'name',
      link,
      since: link === 'up' ? `${2 + (i % 5)} h ${7 + i} min` : `${4 + i} min`,
      err: link === 'down' ? 'read tcp: connection reset by peer' : link === 'never' ? `dial tcp 10.20.${4 + (i >> 3)}.${11 + i}:8910: connect: connection refused` : '',
      srcs: 120 + i * 16,
      dsts: 80 + i * 8,
    };
  });
}

// The one display form of a router: prefix, then Router title. With one router Sode hides the prefix.
const routerName = (r, alone) => (alone ? r.title || 'Router' : `${r.prefix} ${r.title || 'Router ' + r.prefix}`);
const LINK = {
  up: { state: 'ok', glyph: 'circle-check', word: 'Connected' },
  connecting: { state: 'warn', glyph: 'loader-circle', word: 'Connecting' },
  down: { state: 'error', glyph: 'circle-x', word: 'Down' },
  never: { state: 'error', glyph: 'circle-x', word: 'Never connected' },
};
const linkState = (r, long) => {
  const l = LINK[r.link];
  const tail = !long ? '' : r.link === 'up' ? ` for ${r.since}` : r.link === 'down' ? ` for ${r.since}` : '';
  return `<span class="state" data-state="${l.state}">${icon(l.glyph)}<span>${l.word}${tail}</span></span>`;
};

function hashParams() {
  return Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
}

// The prototype bar: a link back and the theme switch.
function protoBar(title, extra = '') {
  const bar = document.createElement('div');
  bar.className = 'proto';
  bar.innerHTML = `<a href="index.html">Prototypes</a><strong>${title}</strong><span class="muted">Fake data. Not app code.</span>${extra}
    <span class="proto__spacer"></span>
    <span class="proto__group" role="group" aria-label="Theme"><span class="caps">Theme</span>
      <button class="pb-btn" data-theme-btn="">Auto</button><button class="pb-btn" data-theme-btn="light">Light</button><button class="pb-btn" data-theme-btn="dark">Dark</button></span>`;
  document.body.prepend(bar);
  const set = (t) => {
    if (t) document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
    for (const b of $$('[data-theme-btn]', bar)) b.classList.toggle('pb-btn--selected', b.dataset.themeBtn === t);
    try { sessionStorage.setItem('proto-theme', t); } catch {}
  };
  bar.addEventListener('click', (e) => {
    const b = e.target.closest('[data-theme-btn]');
    if (b) set(b.dataset.themeBtn);
  });
  let saved = '';
  try { saved = sessionStorage.getItem('proto-theme') || ''; } catch {}
  set(saved);
  return bar;
}

.detail__link { margin-top: 0.2rem; }
.group { border-top: var(--pb-border-w) solid var(--pb-edge-soft); margin-top: 1rem; padding-top: 0.75rem; }
.group__head { align-items: baseline; display: flex; gap: 0.75rem; margin-bottom: 0.6rem; }
.fields { display: grid; gap: 0.75rem 1rem; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); }
.field--short .pb-input { width: 6rem; }

.review h3 { font-size: var(--pb-text-sm); }
.toast { background: var(--pb-surface-overlay); border-left: var(--pb-accent-bar-w) solid var(--pb-text-muted); bottom: 4.5rem; box-shadow: var(--pb-shadow-overlay); padding: 0.6rem 0.9rem; position: fixed; right: 1.5rem; z-index: 30; }
@media (max-width: 62rem) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .toc { display: none; }
  .rt { grid-template-columns: minmax(0, 1fr); }
  .rlist { max-height: 40vh; position: static; }
  .field--wide { grid-column: auto; }
}
</style>

<div class="shell">
  <nav class="toc" aria-label="Settings">
    <input class="pb-input" placeholder="Search settings" aria-label="Search settings" />
    <div class="toc__topic">Preferences</div>
    <div class="toc__topic">Look and feel</div>
    <div class="toc__topic">Routers</div>
    <div class="toc__item" aria-current="true">Routers</div>
    <div class="toc__item">Tie lines</div>
    <div class="toc__item"><a href="protects.html" style="color: inherit; text-decoration: none">Protects</a></div>
    <div class="toc__topic">Access</div>
    <div class="toc__topic">Server</div>
  </nav>
  <main>
    <h1 class="topic">Routers</h1>
    <div class="section__head">
      <h2>Routers</h2>
      <span class="pb-badge">Administrator</span>
    </div>
    <div class="bar">
      <span id="summary" role="status"></span>
      <span class="proto__spacer"></span>

    </div>
  </main>
</div>

<div class="modal-scrim" id="review" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="review-title">
    <div class="modal__head" id="review-title"></div>
    <div class="modal__body review" id="review-body"></div>
    <div class="modal__foot">
      <button class="pb-btn pb-btn--lg" id="review-back">Back</button>
      <button class="pb-btn pb-btn--lg" id="review-go"></button>
    </div>
  </div>
</div>

<script>
const PALETTE = ['#7ae85a', '#4c69fd', '#e5483b', '#f5e663', '#3f8a8c', '#d946ef', '#4a8639', '#67e8f9', '#a061a5', '#f0963e', '#b5efcb', '#e287e8', '#5b86f0', '#8a8a35', '#a5e3f7', '#4fa03a', '#f29bb0', '#d4462e', '#d9822b', '#b89a12', '#6f9e1f', '#1f9e6a', '#17948e', '#1f7fc4', '#4a5fd6', '#7a4fd6', '#b03fc4', '#c93f86', '#9a6440', '#5f7f61', '#5c7299', '#9a8559'];
const RECONNECT = new Set(['address', 'matrix', 'levels', 'levelOffset', 'nameLength', 'nameRequests']);
const LABELS = { prefix: 'Prefix', title: 'Router title', statusLabel: 'Status label', address: 'Address', matrix: 'Matrix', nameRequests: 'Name requests', nameLength: 'Name character limit', levels: 'Levels', levelOffset: 'Level offset', levelNumbering: 'Level numbering', defaultLevels: 'Default levels', numberOffset: 'Source and destination numbers', nameRereadSeconds: 'Re-read names every', routeRereadSeconds: 'Re-read routes every', fireMode: 'Multi destination', salvoGroup: 'Router salvo group', protectDevice: "Sode's device number" };
const OPTION_WORDS = { statusLabel: { address: 'Address', name: 'Title', none: 'Nothing' }, nameRequests: { std: 'Standard', ext: 'Extended' }, numberOffset: { 1: 'Start at 1', 0: 'Start at 0' }, fireMode: { sequential: 'One after another', native: 'Router salvo' } };

const params = hashParams();
let S;
function start(n, lost) {
  const routers = makeRouters(n, lost);
  S = { routers, orig: structuredClone(routers), order0: routers.map((r) => r.uid), def: routers[0].uid, def0: routers[0].uid, sel: routers[0].uid, removed: new Set(), added: new Set(), nextNew: n };
  const want = routers.find((r) => r.prefix === params.router);
  if (want) S.sel = want.uid;
  $('#find').value = '';
  $('#problems').checked = false;
  render();
}

const byUid = (uid) => S.routers.find((r) => r.uid === uid);
const one = () => S.routers.length === 1;
const label = (r, i) => (r.levelNumbering === '0' ? i - 1 : r.levelNumbering === 'va' ? (i === 1 ? 'V' : i - 1) : i);
const rangeText = (r, kind) => {
  const n = Number(r.levels) || 0;
  if (kind === '0') return `0–${n - 1}`;
  if (kind === 'va') return n > 1 ? `V, 1–${n - 1}` : 'V';
  return `1–${n}`;
};
// Default levels in the router's own numbering. Blank is every level. Gives [positions, error].
function parseLevels(r) {
  const n = Number(r.levels) || 0;
  const pos = new Map();
  for (let i = 1; i <= n; i++) pos.set(String(label(r, i)).toUpperCase(), i);
  const text = String(r.defaultLevels).trim().toUpperCase();
  const all = Array.from({ length: n }, (_, i) => i + 1);
  if (!text) return [all, ''];
  const out = new Set();
  for (const part of text.split(/[\s,]+/).filter(Boolean)) {
    const [a, b = a] = part.split(/[-–]/);
    if (!pos.has(a) || !pos.has(b) || pos.get(b) < pos.get(a)) return [[], `"${r.defaultLevels}" is not in ${rangeText(r, r.levelNumbering)}. Use the level numbers of this router.`];
    for (let i = pos.get(a); i <= pos.get(b); i++) out.add(i);
  }
  return [[...out], ''];
}
function changes(r) {
  const o = S.orig.find((x) => x.uid === r.uid);
  if (!o) return [];
  return Object.keys(LABELS).filter((k) => String(r[k]) !== String(o[k])).map((k) => ({ k, was: o[k], now: r[k] }));
}
const orderChanged = () => S.routers.map((r) => r.uid).filter((u) => !S.added.has(u)).join() !== S.order0.join();
function dirtyCount() {
  let n = S.added.size + S.removed.size + (orderChanged() ? 1 : 0) + (S.def !== S.def0 ? 1 : 0);
  for (const r of S.routers) if (!S.added.has(r.uid) && !S.removed.has(r.uid)) n += changes(r).length;
  return n;
}
// Every field error of one router, as [field, text]. Save lists them all and does not go on.
function fieldErrors(r) {
  const out = [];
  if (!/^[^\s:]+:\d+$/.test(r.address)) out.push(['address', 'Address must be host:port.']);
  if (r.nameRequests === 'std' && Number(r.matrix) > 15) out.push(['matrix', 'Matrix must be 0 to 15 with standard name requests.']);
  const e = parseLevels(r)[1];
  if (e) out.push(['defaultLevels', 'Default levels ' + e]);
  return out;
}
const hasProblem = (r) => (r.link !== 'up' && !S.added.has(r.uid)) || fieldErrors(r).length > 0;

function render() {
  renderList();
  renderDetail();
  renderChrome();
}
function renderChrome() {
  const live = S.routers.filter((r) => !S.added.has(r.uid));
  const count = (l) => live.filter((r) => r.link === l).length;
  const parts = [`${count('up')} connected`];
  if (count('down') + count('never')) parts.push(`${count('down') + count('never')} down`);
  if (count('connecting')) parts.push(`${count('connecting')} connecting`);
  $('#summary').textContent = one() ? '' : `${S.routers.length} routers. ${parts.join(', ')}.`;
  $('#rt').toggleAttribute('data-one', one());
  $('#find').hidden = S.routers.length < 8;
  $('#problems-label').hidden = S.routers.length < 4;
  const n = dirtyCount();
  $('#save').disabled = !n;
  $('#dirty').innerHTML = n ? '<span class="pb-note--warn">Unsaved changes</span>' : 'Saved to <span class="mono">/data/config.yaml</span>';
}
function shown() {
  const q = $('#find').value.trim().toLowerCase();
  const only = $('#problems').checked;
  return S.routers.filter((r) => (!q || `${r.prefix} ${r.title} ${r.address}`.toLowerCase().includes(q)) && (!only || hasProblem(r)));
}
function renderList() {
  const list = shown();
  const canDrag = list.length === S.routers.length;
  $('#rlist').innerHTML = list.length
    ? list.map((r) => {
        const marks = [];
        if (r.uid === S.def && !one()) marks.push('<span class="pb-badge">Default</span>');
        if (S.added.has(r.uid)) marks.push('<span class="pb-badge pb-badge--warn">New</span>');
        else if (S.removed.has(r.uid)) marks.push('<span class="pb-badge pb-badge--warn">Remove on Save</span>');
        else if (changes(r).length) marks.push('<span class="pb-badge pb-badge--warn">Edited</span>');
        const state = S.added.has(r.uid) ? '<span>Not saved</span>' : linkState(r);
        return `<div class="rrow" role="option" tabindex="0" data-uid="${r.uid}" aria-current="${r.uid === S.sel}" draggable="${canDrag}" ${S.removed.has(r.uid) ? 'data-removed' : ''}>
          <span class="rrow__grip" title="${canDrag ? 'Drag to change the order' : 'Clear the filter to change the order'}">${icon('grip-vertical')}</span>
          <span class="rrow__prefix num">${esc(r.prefix)}</span>
          <span><span class="rrow__line"><span class="rrow__title">${esc(r.title || 'Router ' + r.prefix)}</span>${marks.join('')}</span>
          <span class="rrow__line rrow__sub"><span class="num">${esc(r.address || 'No address')}</span>${state}</span></span>
        </div>`;
      }).join('')
    : '<div class="rlist__empty">No router matches. <button class="pb-btn" id="clear-find">Show all routers</button></div>';
}

const input = (r, k, extra = '') => `<input class="pb-input" data-k="${k}" value="${esc(r[k])}" ${extra} />`;
const select = (r, k) => `<select class="pb-input" data-k="${k}">${Object.entries(OPTION_WORDS[k]).map(([v, w]) => `<option value="${v}" ${String(r[k]) === v ? 'selected' : ''}>${w}</option>`).join('')}</select>`;
const field = (r, k, control, hint = '', cls = '') => `<div class="field ${cls}"><label class="pb-label">${LABELS[k]}</label>${control}${hint}</div>`;
const hint = (text, kind = '') => `<div class="pb-hint ${kind && 'pb-hint--' + kind}" ${kind === 'error' ? 'role="alert"' : ''}>${text}</div>`;

function renderDetail() {
  const r = byUid(S.sel);
  const d = $('#detail');
  if (!r) return void (d.innerHTML = '');
  const isNew = S.added.has(r.uid);
  const gone = S.removed.has(r.uid);
  const idx = S.routers.indexOf(r);
  const up = r.link === 'up';
  const [defaults, levelErr] = parseLevels(r);
  const wire = Number(r.levelOffset) || 0;
  const heldSode = r.protectDevice > 0 ? 3 + ((idx * 7) % 40) : 0;
  const heldOther = 2 + ((idx * 5) % 30);
  const ties = one() ? 0 : 2 + (idx % 3) * 2;
  const linkLine = isNew
    ? '<span class="muted">Sode connects to a new router after you save.</span>'
    : `${linkState(r, true)}${r.err ? ` <span class="mono muted">${esc(r.err)}</span>` : ''}`;
  d.innerHTML = `
    <div class="detail__head">
      <div>
        <div class="detail__name">${one() ? '' : `<span class="num">${esc(r.prefix)}</span> `}${esc(r.title || 'Router ' + r.prefix)}</div>
        <div class="detail__link">${linkLine}</div>
      </div>
      <div class="detail__acts">
        ${one() ? '' : `<button class="pb-btn" data-act="up" ${idx === 0 ? 'disabled' : ''}>${icon('arrow-up')}Move up</button>
        <button class="pb-btn" data-act="down" ${idx === S.routers.length - 1 ? 'disabled' : ''}>${icon('arrow-down')}Move down</button>`}
        <button class="pb-btn" ${isNew ? 'disabled' : ''} title="Swap a source or destination number on this router">Swap…</button>
        <a class="pb-btn" href="statusbar.html" title="Communication Log, filtered to this router">Log${icon('external-link', true)}</a>
        ${gone ? `<button class="pb-btn" data-act="restore">${icon('undo-2')}Keep this router</button>` : `<button class="pb-btn pb-btn--outline" data-act="remove" ${one() ? 'disabled title="Sode must have one router."' : ''}>Remove…</button>`}
      </div>
    </div>
    ${gone ? hint('Sode removes this router when you save. Presets, filter sets and panels that name it become Broken. Its tie lines go.', 'warn') : ''}

    <div class="group"><div class="group__head"><span class="caps">Router</span></div><div class="fields">
      ${one() ? '' : field(r, 'prefix', input(r, 'prefix', 'maxlength="2" style="text-transform:uppercase"'), hint('One or two letters. B.69 is number 69 on this router.'), 'field--short')}
      ${field(r, 'title', input(r, 'title', 'maxlength="32"'))}
      ${field(r, 'statusLabel', select(r, 'statusLabel'), hint('What the status bar shows when it names this router.'))}
      ${one() ? '' : `<div class="field field--wide"><label class="pb-label">Default router</label>
        <label><input type="radio" name="def" data-act="default" ${r.uid === S.def ? 'checked' : ''} ${gone ? 'disabled' : ''}/> A new browser starts on this router</label>
        ${hint(r.uid === S.def ? 'A bare number in a patch box means this router, until a person picks another.' : `The default router is now ${esc(routerName(byUid(S.def)))}.`)}</div>`}
    </div></div>

    <div class="group"><div class="group__head"><span class="caps">Connection</span><span class="pb-hint">A change here reconnects this router only.</span></div><div class="fields">
      ${field(r, 'address', input(r, 'address', 'placeholder="host:port"'), /^[^\s:]+:\d+$/.test(r.address) ? '' : hint('Enter the address as host:port, for example 10.20.4.12:8910.', 'error'))}
      ${field(r, 'matrix', input(r, 'matrix', 'type="number" min="0" max="255"'), r.nameRequests === 'std' && r.matrix > 15 ? hint('Standard name requests allow matrix 0 to 15. Set Name requests to Extended.', 'error') : '', 'field--short')}
      ${field(r, 'nameRequests', select(r, 'nameRequests'))}
      ${field(r, 'nameLength', input(r, 'nameLength', 'type="number" min="4" max="32"'), '', 'field--short')}
    </div></div>

    <div class="group"><div class="group__head"><span class="caps">Levels</span></div><div class="fields">
      ${field(r, 'levels', input(r, 'levels', 'type="number" min="1" max="256"'), '', 'field--short')}
      ${field(r, 'levelOffset', input(r, 'levelOffset', 'type="number"'), hint(`${label(r, 1) === 'V' ? 'Level V' : 'Level ' + label(r, 1)} = level ${1 + wire} on the router.`), 'field--short')}
      <div class="field field--wide"><label class="pb-label">Level numbering</label><div class="seg" role="group">
        ${['1', '0', 'va'].map((k) => `<button class="pb-btn ${r.levelNumbering === k ? 'pb-btn--selected' : ''}" data-numbering="${k}" aria-pressed="${r.levelNumbering === k}"><span class="num">${rangeText(r, k)}</span></button>`).join('')}
      </div>${hint('This changes only how Sode shows and reads level numbers. V is the first level, for video.')}</div>
      ${field(r, 'defaultLevels', input(r, 'defaultLevels', `placeholder="All levels" aria-invalid="${!!levelErr}"`), levelErr ? hint(levelErr, 'error') : hint(String(r.defaultLevels).trim() ? `${defaults.length} of ${r.levels} levels.` : 'Blank means every level, also after the level count changes.'))}
    </div>
    <div class="chips" aria-label="Levels of this router">${Array.from({ length: Math.min(Number(r.levels) || 0, 64) }, (_, i) => {
      const c = PALETTE[i % 32];
      const dark = parseInt(c.slice(1, 3), 16) * 0.3 + parseInt(c.slice(3, 5), 16) * 0.59 + parseInt(c.slice(5, 7), 16) * 0.11 < 140;
      return `<span class="chip" style="background:${c};color:${dark ? '#fff' : '#000'}" ${levelErr || defaults.includes(i + 1) ? '' : 'data-off title="Not a default level"'}>${label(r, i + 1)}</span>`;
    }).join('')}</div>
    ${hint('Colors come from Look and feel > Level colors, by position. They are the same for every router.')}</div>

    <div class="group"><div class="group__head"><span class="caps">Router names</span></div><div class="fields">
      ${field(r, 'numberOffset', select(r, 'numberOffset'))}
      ${field(r, 'nameRereadSeconds', input(r, 'nameRereadSeconds', 'type="number" min="0"'), hint('In seconds. 0 is off.'), 'field--short')}
    </div><div class="facts">
      ${isNew ? '<span class="muted">Sode reads the names after you save.</span>' : `<span><span class="num">${r.srcs}</span> sources, <span class="num">${r.dsts}</span> destinations. ${up ? 'Read at 14:02:10.' : 'Last read at 13:48:31, before the link went down.'}</span>
      <button class="pb-btn" ${up ? '' : 'disabled'}>Re-read now</button>${up ? '' : '<span class="pb-hint">Sode cannot read the names while the Router link is down.</span>'}`}
    </div></div>

    <div class="group"><div class="group__head"><span class="caps">Takes</span></div><div class="fields">
      ${field(r, 'fireMode', select(r, 'fireMode'))}
      ${field(r, 'salvoGroup', input(r, 'salvoGroup', 'type="number" min="0" max="127"'), r.fireMode === 'native' ? hint('Pick a group that only Sode uses.') : hint('Used only with Router salvo.'), 'field--short')}
      ${field(r, 'routeRereadSeconds', input(r, 'routeRereadSeconds', 'type="number" min="0"'), hint('In seconds. 0 is off.'), 'field--short')}
    </div></div>

    <div class="group"><div class="group__head"><span class="caps">Protects</span></div><div class="fields">
      ${field(r, 'protectDevice', input(r, 'protectDevice', 'type="number" min="0" max="4095"'), hint('0 is off. Panels use the same numbers. Pick a number that no panel uses.'), 'field--short')}
    </div><div class="facts">
      ${Number(r.protectDevice) > 0
        ? `<span>${icon('shield')} Sode has <span class="num">${heldSode}</span> Protects on this router. Other devices have <span class="num">${heldOther}</span>.</span>`
        : `<span class="state" data-state="warn">${icon('shield-off')}<span>Protect is off for this router. Sode cannot set a Protect here.</span></span>`}
      <a href="protects.html">Show in Protects</a>
    </div></div>

    ${one() ? '' : `<div class="group"><div class="group__head"><span class="caps">Tie lines</span></div><div class="facts">
      <span>${icon('cable')} <span class="num">${ties}</span> tie lines: <span class="num">${ties / 2}</span> from this router, <span class="num">${ties / 2}</span> to this router.</span>
      <a href="#" data-act="noop">Show in Tie lines</a>
    </div></div>`}`;
}

function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.textContent = text;
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}
function move(uid, to) {
  const from = S.routers.findIndex((r) => r.uid === uid);
  if (from < 0 || to < 0 || to >= S.routers.length || from === to) return;
  const [r] = S.routers.splice(from, 1);
  S.routers.splice(to, 0, r);
  render();
}

$('#rlist').addEventListener('click', (e) => {
  if (e.target.id === 'clear-find') {
    $('#find').value = '';
    $('#problems').checked = false;
    return render();
  }
  const row = e.target.closest('.rrow');
  if (row) {
    S.sel = row.dataset.uid;
    render();
  }
});
$('#rlist').addEventListener('keydown', (e) => {
  const row = e.target.closest('.rrow');
  if (!row) return;
  const rows = $$('.rrow');
  const i = rows.indexOf(row);
  const focusRow = (uid) => $(`.rrow[data-uid="${uid}"]`)?.focus();
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    const uid = row.dataset.uid;
    S.sel = uid;
    move(uid, S.routers.findIndex((r) => r.uid === uid) + (e.key === 'ArrowUp' ? -1 : 1));
    focusRow(uid);
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const next = rows[i + (e.key === 'ArrowUp' ? -1 : 1)];
    if (next) {
      S.sel = next.dataset.uid;
      render();
      focusRow(S.sel);
    }
  } else if (e.key === 'Enter') {
    S.sel = row.dataset.uid;
    render();
    $('#detail .pb-input')?.focus();
  }
});
let dragUid = '';
$('#rlist').addEventListener('dragstart', (e) => {
  dragUid = e.target.closest('.rrow')?.dataset.uid || '';
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragUid);
});
$('#rlist').addEventListener('dragover', (e) => {
  const row = e.target.closest('.rrow');
  if (!row || !dragUid) return;
  e.preventDefault();
  for (const x of $$('.rrow[data-drop]')) delete x.dataset.drop;
  const box = row.getBoundingClientRect();
  row.dataset.drop = e.clientY < box.top + box.height / 2 ? 'before' : 'after';
});
$('#rlist').addEventListener('drop', (e) => {
  const row = e.target.closest('.rrow');
  if (!row || !dragUid) return;
  e.preventDefault();
  const after = row.dataset.drop === 'after';
  const moved = S.routers.splice(S.routers.findIndex((r) => r.uid === dragUid), 1)[0];
  S.routers.splice(S.routers.findIndex((r) => r.uid === row.dataset.uid) + (after ? 1 : 0), 0, moved);
  dragUid = '';
  render();
});
$('#rlist').addEventListener('dragend', () => {
  dragUid = '';
  for (const x of $$('.rrow[data-drop]')) delete x.dataset.drop;
});

$('#detail').addEventListener('input', (e) => {
  const k = e.target.dataset.k;
  if (!k) return;
  const r = byUid(S.sel);
  r[k] = k === 'prefix' ? e.target.value.toUpperCase() : e.target.value;
  renderList();
  renderChrome();
});
// Hints and the level chips depend on the values, so draw the detail again when a field is left.
$('#detail').addEventListener('change', (e) => {
  if (!e.target.dataset.k) return;
  const k = e.target.dataset.k;
  renderDetail();
  $(`#detail [data-k="${k}"]`)?.focus();
});
$('#detail').addEventListener('click', (e) => {
  const r = byUid(S.sel);
  const nb = e.target.closest('[data-numbering]');
  if (nb) {
    r.levelNumbering = nb.dataset.numbering;
    return render();
  }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  const idx = S.routers.indexOf(r);
  if (act === 'noop') e.preventDefault();
  if (act === 'up') move(r.uid, idx - 1);
  if (act === 'down') move(r.uid, idx + 1);
  if (act === 'default') {
    S.def = r.uid;
    render();
  }
  if (act === 'remove') {
    if (S.added.has(r.uid)) {
      S.added.delete(r.uid);
      S.routers.splice(idx, 1);
      S.sel = S.routers[Math.max(0, idx - 1)].uid;
    } else {
      S.removed.add(r.uid);
      if (S.def === r.uid) S.def = S.routers.find((x) => !S.removed.has(x.uid)).uid;
    }
    render();
  }
  if (act === 'restore') {
    S.removed.delete(r.uid);
    render();
  }
});
$('#find').addEventListener('input', renderList);
$('#problems').addEventListener('change', renderList);
$('#add').addEventListener('click', () => {
  const used = new Set(S.routers.map((r) => r.prefix));
  let p = '';
  for (let i = 0; i < 26 && !p; i++) if (!used.has(prefixOf(i))) p = prefixOf(i);
  for (let i = 0; i < 26 && !p; i++) if (!used.has('A' + prefixOf(i))) p = 'A' + prefixOf(i);
  const r = { ...makeRouters(1)[0], uid: 'new' + S.nextNew++, prefix: p, title: 'Router ' + p, address: '', protectDevice: 0, defaultLevels: '', link: 'up', err: '' };
  S.routers.push(r);
  S.added.add(r.uid);
  S.sel = r.uid;
  $('#find').value = '';
  $('#problems').checked = false;
  render();
  $(`.rrow[data-uid="${r.uid}"]`)?.scrollIntoView({ block: 'nearest' });
  $('#detail [data-k="address"]')?.focus();
});

// The review names each router by prefix and title, and each router that reconnects with its new address.
$('#save').addEventListener('click', () => {
  const bad = S.routers.filter((r) => !S.removed.has(r.uid)).flatMap((r) => fieldErrors(r).map(([k, text]) => ({ r, k, text })));
  if (bad.length) {
    $('#review-title').textContent = `Not saved. ${bad.length} field${bad.length === 1 ? ' has' : 's have'} an error.`;
    $('#review-body').innerHTML = `<ul>${bad.map((b) => `<li><a href="#" data-goto="${b.r.uid}" data-field="${b.k}"><strong>${esc(routerName(b.r))}</strong></a>: <span class="pb-hint--error">${esc(b.text)}</span></li>`).join('')}</ul><p class="pb-hint">Select a line to go to the field.</p>`;
    const go = $('#review-go');
    go.className = 'pb-btn pb-btn--lg sode-btn--primary';
    go.textContent = 'Save';
    go.disabled = true;
    $('#review').hidden = false;
    return;
  }
  $('#review-go').disabled = false;
  const groups = [];
  const reconnect = [];
  const top = [];
  if (S.def !== S.def0) top.push(`Default router: was ${esc(routerName(S.orig.find((r) => r.uid === S.def0)))}, now <strong>${esc(routerName(byUid(S.def)))}</strong>`);
  if (orderChanged()) top.push(`Router order: now <span class="num">${S.routers.filter((r) => !S.removed.has(r.uid)).map((r) => esc(r.prefix)).join(', ')}</span>`);
  if (top.length) groups.push(['All routers', top]);
  for (const r of S.routers) {
    const o = S.orig.find((x) => x.uid === r.uid);
    if (S.added.has(r.uid)) {
      groups.push([`${routerName(r)} (new)`, [`Add at <span class="num">${esc(r.address || 'no address')}</span>, matrix ${esc(r.matrix)}, ${esc(r.levels)} levels, numbering ${rangeText(r, r.levelNumbering)}`, `Sode's device number: ${esc(r.protectDevice)}${Number(r.protectDevice) ? '' : ' (Protect is off)'}`]]);
    } else if (S.removed.has(r.uid)) {
      groups.push([routerName(o), ['Remove this router. Items that name it become Broken.']]);
    } else {
      const ch = changes(r);
      if (!ch.length) continue;
      const word = (k, v) => OPTION_WORDS[k]?.[v] ?? (k === 'levelNumbering' ? rangeText(r, v) : v === '' ? (k === 'defaultLevels' ? 'All levels' : 'blank') : v);
      groups.push([routerName(o), ch.map((c) => `${LABELS[c.k]}: was <span class="num">${esc(word(c.k, c.was))}</span>, now <strong class="num">${esc(word(c.k, c.now))}</strong>`)]);
      if (ch.some((c) => RECONNECT.has(c.k))) reconnect.push(r);
    }
  }
  const n = dirtyCount();
  $('#review-title').textContent = `Save ${n} change${n === 1 ? '' : 's'}?`;
  $('#review-body').innerHTML =
    groups.map(([name, rows]) => `<h3>${esc(name)}</h3><ul>${rows.map((x) => `<li>${x}</li>`).join('')}</ul>`).join('') +
    (reconnect.length
      ? `<p class="pb-note--warn">${icon('triangle-alert')} Sode reconnects ${reconnect.map((r) => `<strong>${esc(routerName(r))}</strong> at <span class="num">${esc(r.address)}</span>`).join(', ')}. Takes on ${reconnect.length === 1 ? 'that router' : 'those routers'} stop until the router answers. Other routers keep their links.</p>`
      : '') +
    '<p class="pb-hint">The PIN recheck comes after this step, and nothing asks again after the PIN.</p>';
  const go = $('#review-go');
  go.className = `pb-btn pb-btn--lg ${reconnect.length ? 'pb-btn--commit' : 'sode-btn--primary'}`;
  go.textContent = reconnect.length ? 'Save and reconnect' : 'Save';
  $('#review').hidden = false;
  go.focus();
});
$('#review-back').addEventListener('click', () => ($('#review').hidden = true));
$('#review-body').addEventListener('click', (e) => {
  const a = e.target.closest('[data-goto]');
  if (!a) return;
  e.preventDefault();
  S.sel = a.dataset.goto;
  $('#find').value = '';
  $('#problems').checked = false;
  $('#review').hidden = true;
  render();
  const f = $(`#detail [data-k="${a.dataset.field}"]`);
  f?.scrollIntoView({ block: 'center' });
  f?.focus();
});
$('#review-go').addEventListener('click', () => {
  for (const r of S.routers) {
    const ch = S.added.has(r.uid) ? [{ k: 'address' }] : changes(r);
    if (ch.some((c) => RECONNECT.has(c.k))) Object.assign(r, { link: 'connecting', err: '' });
  }
  S.routers = S.routers.filter((r) => !S.removed.has(r.uid));
  if (!byUid(S.sel)) S.sel = S.routers[0].uid;
  Object.assign(S, { orig: structuredClone(S.routers), order0: S.routers.map((r) => r.uid), def0: S.def, removed: new Set(), added: new Set() });
  $('#review').hidden = true;
  render();
  toast('Settings saved.');
});
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') $('#review').hidden = true;
});

const counts = [1, 2, 12, 24];
const bar = protoBar('Routers: list and detail', `<span class="proto__group" role="group" aria-label="Routers"><span class="caps">Routers</span>${counts.map((n) => `<button class="pb-btn" data-n="${n}">${n}</button>`).join('')}</span>`);
function pick(n, lost) {
  for (const b of $$('[data-n]', bar)) b.classList.toggle('pb-btn--selected', Number(b.dataset.n) === n);
  start(n, lost);
}
bar.addEventListener('click', (e) => {
  const b = e.target.closest('[data-n]');
  if (b) pick(Number(b.dataset.n));
});
// A link from the status bar prototype carries the count, the router and the lost routers, so the two pages agree.
const lostFromHash = params.lost !== undefined ? Object.fromEntries(params.lost.split(',').filter(Boolean).map((x) => x.split(':'))) : undefined;
pick(Math.min(24, Math.max(1, Number(params.n) || 12)), lostFromHash);
</script>
</body>
